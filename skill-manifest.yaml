name: ultimate-dev
version: 1.6.0
description: >
  Master software-engineering orchestrator. Adapts to model size: tiny→inline,
  small→1 module, large→parallel agents, huge→full system. 44 modules, 33 personas.

author: ultimate-dev
license: MIT
last_updated: 2026-09-21
# Updated: Added TUI installation, multi-tool detection, meta personas

# Architecture
tier:
  0: SKILL.md (core router — always loaded, ~500 tokens)
  1: modules/ (domain modules — loaded on classification match)
  2: personas/ (execution specialists — spawned as sub-agents)

