# Router Files
router:
  - path: router/classification-rules.md
    purpose: Task classification (size, domain, risk, clarity)
  - path: router/decomposition.md
    purpose: Complex task decomposition into subtasks
  - path: router/token-budgets.md
    purpose: Context and token budget enforcement
  - path: router/grounding-rules.md
    purpose: Library/tool/API claim verification
  - path: router/completion-checklist.md
    purpose: Deliverable completeness verification
  - path: router/invocation-template.md
    purpose: Sub-agent invocation contract template
  - path: router/precedence-rules.md
    purpose: Conflict resolution between modules
  - path: router/self-check.md
    purpose: Process compliance verification
  - path: router/gap-promotion-rules.md
    purpose: Domain gap promotion lifecycle and validation
  - path: router/lite-mode.md
    purpose: Simplified router for small/tiny models

