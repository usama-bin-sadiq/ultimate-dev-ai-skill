# Pull Request Quality Checks

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Job 1: PR Title Convention
  pr-title:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  # Job 2: PR Size Check
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const changes = pr.additions + pr.deletions;
            if (changes > 1000) {
              core.warning(`PR is large: ${changes} changes. Consider breaking it up.`);
            }

  # Job 3: Code Review Requirements
  review-check:
    name: Review Check
    runs-on: ubuntu-latest
    needs: [pr-title, pr-size]
    steps:
      - name: Check for required reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const approved = reviews.filter(r => r.state === 'APPROVED').length;
            if (approved < 1) {
              core.setFailed('PR needs at least 1 approval');
            }

  # Job 4: Conflict Detection
  conflict-check:
    name: Conflict Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for merge conflicts
        run: |
          git fetch origin main
          git merge --no-commit --no-ff origin/main || {
            echo "Merge conflicts detected!"
            exit 1
          }

  # Job 5: Changelog Check
  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if CHANGELOG.md was updated
        uses: brettmiller/check-changelog-action@v1
        with:
          changelog-path: 'CHANGELOG.md'