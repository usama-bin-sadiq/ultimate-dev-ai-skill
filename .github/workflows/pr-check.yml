name: PR Template & Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-template-check:
    name: PR Template Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR body has required sections
        id: pr-check
        run: |
          BODY="${{ github.event.pull_request.body }}"
          TITLE="${{ github.event.pull_request.title }}"
          
          # Check for required template sections
          MISSING=""
          
          if ! echo "$BODY" | grep -q "## Description"; then
            MISSING="$MISSING\n- ## Description"
          fi
          
          if ! echo "$BODY" | grep -q "## Type of Change"; then
            MISSING="$MISSING\n- ## Type of Change"
          fi
          
          if ! echo "$BODY" | grep -q "## Release Impact"; then
            MISSING="$MISSING\n- ## Release Impact"
          fi
          
          if ! echo "$BODY" | grep -q "## Checklist"; then
            MISSING="$MISSING\n- ## Checklist"
          fi
          
          if ! echo "$BODY" | grep -q "## Related Issues"; then
            MISSING="$MISSING\n- ## Related Issues"
          fi
          
          if [ -n "$MISSING" ]; then
            echo "missing_sections=true" >> $GITHUB_OUTPUT
            echo "missing=$MISSING" >> $GITHUB_OUTPUT
            echo "::error::PR template sections missing:$MISSING"
          else
            echo "missing_sections=false" >> $GITHUB_OUTPUT
          fi
          
          # Check conventional commit title
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            echo "conventional_title=true" >> $GITHUB_OUTPUT
            echo "✅ PR title follows conventional commits"
          else
            echo "conventional_title=false" >> $GITHUB_OUTPUT
            echo "::warning::PR title should follow conventional commits: type(scope): description"
          fi
          
          # Check for release label on main branch PRs
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ "$BASE_REF" = "main" ]; then
            LABELS=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}')
            if echo "$LABELS" | grep -qE '"release:(patch|minor|major)"'; then
              echo "has_release_label=true" >> $GITHUB_OUTPUT
              echo "✅ Release label found"
            else
              echo "has_release_label=false" >> $GITHUB_OUTPUT
              echo "::warning::PR targeting main should have release label: release:patch, release:minor, or release:major"
            fi
          fi

      - name: Add compliance label
        if: steps.pr-check.outputs.missing_sections == 'false' && steps.pr-check.outputs.conventional_title == 'true'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label "pr:compliant" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove compliance label
        if: steps.pr-check.outputs.missing_sections == 'true' || steps.pr-check.outputs.conventional_title == 'false'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "pr:compliant" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on non-compliant PR
        if: steps.pr-check.outputs.missing_sections == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const missing = `${{ steps.pr-check.outputs.missing }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **PR Template Incomplete**\n\nMissing required sections:${missing}\n\nPlease update the PR description to follow the template.`
            });