name: PR Template & Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# PR metadata is untrusted.  This workflow is deliberately read-only; any
# label/comment/release writeback must run from a separately trusted workflow
# after validation and approval.
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pr-template-check:
    name: PR Template Compliance (Read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      missing_sections: ${{ steps.pr-check.outputs.missing_sections }}
      conventional_title: ${{ steps.pr-check.outputs.conventional_title }}
      has_release_label: ${{ steps.pr-check.outputs.has_release_label }}
    steps:
      - name: Checkout metadata validation context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR metadata
        id: pr-check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          missing_sections=false
          for section in '## Description' '## Type of Change' '## Release Impact' '## Checklist' '## Related Issues'; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fq -- "$section"; then
              missing_sections=true
            fi
          done
          printf 'missing_sections=%s\n' "$missing_sections" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            conventional_title=true
          else
            conventional_title=false
          fi
          printf 'conventional_title=%s\n' "$conventional_title" >> "$GITHUB_OUTPUT"

          if [ "$PR_BASE_REF" = 'main' ] && printf '%s' "$PR_LABELS" | jq -e 'any(.[]; . == "release:patch" or . == "release:minor" or . == "release:major")' >/dev/null; then
            has_release_label=true
          else
            has_release_label=false
          fi
          printf 'has_release_label=%s\n' "$has_release_label" >> "$GITHUB_OUTPUT"

  cancel-siblings:
    name: Cancel sibling workflows on failure
    runs-on: ubuntu-latest
    # Same fail-fast contract as validate.yml, scoped by head_sha.
    if: failure()
    needs: [pr-template-check]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel every other run of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=${status}" \
              --jq '.workflow_runs[].id' | while read -r id; do
                [ -z "$id" ] && continue
                [ "$id" = "${{ github.run_id }}" ] && continue
                echo "cancelling run ${id}"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/cancel"
              done
          done
