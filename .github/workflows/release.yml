name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]
      release_notes:
        description: 'Optional release notes'
        required: false
        type: string

# The decision job below is read-only and uses the workflow token. Only the
# gated create-release job holds a write token, and only after the `release`
# environment has been approved.
permissions:
  contents: read

# A release must never be cancelled halfway. One repository-wide group
# serialises push, merged-PR, and manual releases.
concurrency:
  group: ultimate-dev-write-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Nothing below this job runs until the tree validates. `needs:` only
  # orders jobs inside one workflow -- it cannot express "wait for the
  # Validate workflow" -- so the gate has to sit on the release path
  # itself. Without it, Validate and Release both trigger on `push: main`
  # and start at the same instant, and a red commit races its own
  # release to the tag.
  #
  # This also closes a hole validate.yml leaves open on purpose: it
  # ignores pushes that touch only VERSION and CHANGELOG.md, which is
  # exactly the shape of a release commit. Those commits were never
  # validated by that workflow at all. This job validates every commit
  # that reaches here, release commits included.
  validate:
    name: Validate Before Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: The tree validates
        run: python ultimate-dev/tools/validate-skills.py --strict

  should-release:
    name: Determine Release Need
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version_type: ${{ steps.check.outputs.version_type }}
      release_notes: ${{ steps.check.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_MESSAGE: ${{ github.head_commit.message }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MANUAL_VERSION_TYPE: ${{ inputs.version_type }}
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
          # The step below calls the commits-to-pulls API with
          # $GITHUB_TOKEN under `set -u`. secrets.GITHUB_TOKEN is not exported
          # into the environment implicitly, so the variable was unbound and the
          # step died with "GITHUB_TOKEN: unbound variable" on any push whose
          # message was not itself a release commit. The job had only ever
          # appeared to work because its own `chore: release v*` output exits
          # before the call site.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          write_scalar() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          write_notes() {
            python3 - "$GITHUB_OUTPUT" "$1" <<'PY'
          import secrets
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          value = sys.argv[2] if len(sys.argv) > 2 else ""
          delimiter = "ULTIMATE_DEV_" + secrets.token_hex(16)
          while delimiter in value:
              delimiter = "ULTIMATE_DEV_" + secrets.token_hex(16)
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"release_notes<<{delimiter}\n{value}\n{delimiter}\n")
          PY
          }

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            case "$MANUAL_VERSION_TYPE" in
              patch|minor|major) ;;
              *) echo 'Invalid manual version_type' >&2; exit 2 ;;
            esac
            write_scalar should_release true
            write_scalar version_type "$MANUAL_VERSION_TYPE"
            write_notes "${MANUAL_RELEASE_NOTES:-}"
            exit 0
          fi

          write_scalar should_release false
          write_scalar version_type ''
          write_notes ''

          # A merged PR with an explicit release label is released from here.
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            [ "$MERGED" = 'true' ] || exit 0
            version_type=$(printf '%s' "$PR_LABELS" | jq -r '
              map(select(. == "release:major" or . == "release:minor" or . == "release:patch")) |
              if index("release:major") then "major"
              elif index("release:minor") then "minor"
              elif index("release:patch") then "patch"
              else empty end')
            if [ -z "$version_type" ]; then
              echo 'No explicit release label; the main push event will handle it.' >&2
              exit 0
            fi
            write_scalar should_release true
            write_scalar version_type "$version_type"
            exit 0
          fi

          [ "$EVENT_NAME" = 'push' ] || exit 0
          [ "$PUSH_REF" = 'refs/heads/main' ] || exit 0

          # The release commit must not recursively start another release.
          #
          # github.head_commit.message is empty for a push made with a token, so
          # this case statement was matching against the empty string, never
          # matched, and every release commit started another release. The
          # observed result was v4.0.0 through v4.0.8 in four minutes.
          #
          # The event payload is a convenience; the repository is the source of
          # truth. Read the subject from the commit that was actually pushed, and
          # fall back to the payload only if the checkout somehow has no history.
          subject="$(git log -1 --format=%B "$PUSH_SHA" 2>/dev/null || true)"
          if [ -z "$subject" ]; then
            subject="$PUSH_MESSAGE"
          fi
          echo "commit subject: ${subject%%$'\n'*}"
          case "$subject" in
            'chore: release v'*|*'[skip release]'*)
              echo 'Maintenance commit; skipping recursive release.' >&2
              exit 0
              ;;
          esac

          if [[ ! "$PUSH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Invalid push commit SHA; refusing release.' >&2
            exit 1
          fi

          # A merged PR carrying a release label is handled by the pull_request
          # event above. Looking up the PRs for this commit prevents the same
          # merge being released twice while leaving unlabelled merges and direct
          # commits to the push path.
          # A label lookup is an optimisation, not a precondition. If the API is
          # unreachable, rate-limited, or rejects the request, the release must
          # still be decidable from the commit subject alone -- which is the
          # deterministic path below. Failing the step here would block every
          # release over a read-only lookup that has a working fallback.
          pr_payload=$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-22' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$PUSH_SHA/pulls" \
            2>/dev/null) || pr_payload=''
          release_label=$(printf '%s' "$pr_payload" | jq -r '
            map(select(.merged_at != null) | .labels[]?.name) |
            map(select(. == "release:major" or . == "release:minor" or . == "release:patch")) |
            first // empty')
          if [ -n "$release_label" ]; then
            echo "Merged PR with $release_label is handled by the pull_request event." >&2
            exit 0
          fi

          # Direct commits and unlabelled merges get a deterministic bump.
          # Explicit trailers override conventional-commit inference.
          lower_message=${PUSH_MESSAGE,,}
          case "$lower_message" in
            *'[release:major]'*|*'breaking change'*|*'!:'*) version_type='major' ;;
            *'[release:minor]'*|*'feat:'*|*'feat '*|*'feature:'*|*'feature '*) version_type='minor' ;;
            *'[release:patch]'*) version_type='patch' ;;
            *) version_type='patch' ;;
          esac

          write_scalar should_release true
          write_scalar version_type "$version_type"

  release-gate:
    name: Release Approval Gate
    needs: should-release
    if: needs.should-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - name: Confirm release environment gate
        run: echo 'Release environment gate approved.'

  create-release:
    name: Create Release
    needs: [should-release, release-gate]
    if: >-
      needs.should-release.outputs.should_release == 'true' &&
      needs.release-gate.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ULTIMATE_DEV_TOKEN lives in the CICD environment, separate from the
    # read-only decision job above.
    environment: CICD
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ULTIMATE_DEV_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: version
        env:
          VERSION_TYPE: ${{ needs.should-release.outputs.version_type }}
        run: |
          set -euo pipefail
          current=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $current" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          major=$((10#$major)); minor=$((10#$minor)); patch=$((10#$patch))
          case "$VERSION_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Invalid release version type: $VERSION_TYPE" >&2; exit 1 ;;
          esac
          new_version="$major.$minor.$patch"
          # Check the LOCAL tag namespace, not the remote.
          #
          # This was `git ls-remote --exit-code --tags origin`, and it never
          # worked here. The checkout sets persist-credentials: false and this
          # step holds no token, so on a private repo ls-remote exited 128
          # ("could not read Username for 'https://github.com'"). Its stderr
          # went to /dev/null, so the guard read an authentication error as
          # "tag does not exist", waved the bump through, and the next step
          # died on `fatal: tag 'v4.0.42' already exists`. It failed in exactly
          # the case it existed to catch, and hid the reason while doing it.
          #
          # `fetch-depth: 0` already fetches remote tags, so the local
          # namespace is what `git tag` below will actually collide with. A
          # local check needs no credential and cannot be silenced by an
          # unrelated network or auth failure.
          if git rev-parse -q --verify "refs/tags/v$new_version" >/dev/null; then
            echo "Tag v$new_version already exists; refusing duplicate release" >&2
            echo "VERSION is $current, so this release wants v$new_version, which is taken." >&2
            echo "Reconcile VERSION with the tag before releasing again." >&2
            exit 1
          fi
          printf '%s\n' "$new_version" > VERSION
          printf 'new_version=%s\n' "$new_version" >> "$GITHUB_OUTPUT"
          printf 'old_version=%s\n' "$current" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          # Written by the version step for workflow_dispatch, where a human
          # typed the notes, and empty for a push. It was exported as a job
          # output and then read by nothing: the entry below was a hardcoded
          # placeholder, so every release in this repository's history shipped
          # "_No summary recorded._" and the GitHub release body, which is
          # extracted from the changelog, said the same thing. The plumbing was
          # built and left disconnected.
          RELEASE_NOTES: ${{ steps.check.outputs.release_notes }}
        run: |
          set -euo pipefail
          date_str=$(date +%Y-%m-%d)
          if grep -Fqx -- "## [$NEW_VERSION] — $date_str" CHANGELOG.md; then
            echo 'changelog entry already present'
            exit 0
          fi
          python3 - CHANGELOG.md "$NEW_VERSION" "$date_str" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version, date = sys.argv[2], sys.argv[3]
          text = path.read_text(encoding="utf-8")
          header = f"## [{version}] — {date}"

          if re.search(rf"^## \[{re.escape(version)}\]", text, re.MULTILINE):
              raise SystemExit(f"changelog already has an entry for {version}")

          # A human's notes win. They were typed for this release and are the
          # most accurate description of it available.
          notes = (os.environ.get("RELEASE_NOTES") or "").strip()

          if not notes:
              # Otherwise describe what is actually being released: the commits
              # between the previous version tag and this commit. A push release
              # is exactly that set of commits, so the changelog entry is
              # derived from the same range the tag is about to be cut from.
              # The new tag does not exist yet -- this step runs before the tag
              # is cut -- so the range has to be anchored on HEAD, not on
              # f"{version}^". That form is fatal: "Not a valid object name
              # v4.0.26^". Anchoring on HEAD is also what we actually want: the
              # most recent tag reachable from here is the previous release,
              # because the one being cut is not on the branch yet.
              previous = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD"],
                  capture_output=True, text=True, check=False,
              )
              if previous.returncode == 0 and previous.stdout.strip():
                  span = f"{previous.stdout.strip()}..HEAD"
              else:
                  span = "HEAD"
              log = subprocess.run(
                  ["git", "log", "--no-merges", "--format=%s", span],
                  capture_output=True, text=True, check=False,
              )
              if log.returncode == 0:
                  subjects = [s for s in (x.strip() for x in log.stdout.split("\n")) if s]
                  if subjects:
                      notes = "\n".join(f"- {s}" for s in subjects)
                  else:
                      # Only merge commits in range: list them, since a release
                      # that changed something is a release worth naming.
                      merged = subprocess.run(
                          ["git", "log", "--merges", "--format=- %s", span],
                          capture_output=True, text=True, check=False,
                      )
                      notes = merged.stdout.strip() if merged.returncode == 0 else ""

          if not notes:
              # Last resort. This is the one case where the old placeholder was
              # honest, and it now says so -- as a fact about the run rather
              # than as the output of a generator that never tried.
              notes = "_No commits or notes to summarise for this release._"

          entry = f"{header}\n\n{notes}\n"
          # Insert directly beneath the H1 so newest-first order is preserved.
          match = re.search(r"^# .*$", text, re.MULTILINE)
          if not match:
              raise SystemExit("CHANGELOG.md has no H1 heading")

          # The blank line after the entry is load-bearing for readability, and
          # the placeholder version did not emit one: every entry in the file
          # ran straight into the next `## [` heading with no separation. It
          # still renders, because a heading starts a block, but every entry
          # reads as one undifferentiated wall. One newline more, deliberately.
          tail = text[match.end():].lstrip("\n")
          updated = f"{text[:match.end()]}\n\n{entry}\n{tail}"
          path.write_text(updated, encoding="utf-8")
          PY

      # A release must not be able to ship a skill that does not validate, a
      # structure that does not validate, or a changelog that disagrees with VERSION.
      - name: Verify the release is releasable
        run: |
          set -euo pipefail
          python ultimate-dev/tools/validate-skills.py --strict
          version=$(tr -d '[:space:]' < VERSION)
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi

      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          ULTIMATE_DEV_TOKEN: ${{ secrets.ULTIMATE_DEV_TOKEN }}
        run: |
          set -euo pipefail
          git add -- VERSION CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Release produced no file changes' >&2
            exit 1
          fi
          git commit -m "chore: release v$NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"

          # checkout is configured with persist-credentials: false, so the token
          # was used to fetch and then discarded. Nothing was left for the push,
          # and it failed with "could not read Username for 'https://github.com'"
          # -- an authentication error that reads like a permissions problem and
          # is actually a missing credential. This is the same class of bug as
          # the unbound GITHUB_TOKEN: the release path had never run end to end,
          # because the step before it always died first.
          #
          # The token is supplied per-command via http.extraheader rather than by
          # turning persistence back on, so it is not left sitting in
          # .git/config for any later step to pick up.
          if [ -z "${ULTIMATE_DEV_TOKEN:-}" ]; then
            echo 'ULTIMATE_DEV_TOKEN is empty. It must be set on the CICD' >&2
            echo 'environment; the job cannot push without it.' >&2
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$ULTIMATE_DEV_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push origin main --tags

      - name: Create GitHub Release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          # `gh release create` needs a credential of its own. The step that
          # pushes the tag supplies ULTIMATE_DEV_TOKEN inline, and the version
          # step supplies GITHUB_TOKEN, but this step declared neither -- and
          # `gh` does not inherit either, because neither was exported into the
          # job environment. It failed with "To use GitHub CLI in a GitHub
          # Actions workflow, set the GH_TOKEN environment variable", exit 4.
          #
          # This is the third time this workflow has died on a credential the
          # step did not declare. The first was an unbound GITHUB_TOKEN under
          # `set -u`; the second was a push with persist-credentials disabled;
          # this one is a missing token on the release call itself. Each was
          # only reachable because the step before it happened to die first,
          # which is why all three survived as long as they did. The class is
          # now checked mechanically by tools/check-workflow-auth.py.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The version is passed bare, not as "[$NEW_VERSION]". awk's `~` takes
          # a dynamic *regular expression*, so the brackets in an interpolated
          # value are read as a character class -- the pattern became
          # `^## [4.0.29]`, which matches one character from the set {4,.,0,2,9}
          # where the heading has a literal `[`. Nothing matched, `found` was
          # never set, and every release shipped `--notes ""`. The version is
          # already validated as digits-and-dots by the step above, so bare with
          # escaped brackets in the pattern is exact.
          notes=$(awk -v v="$NEW_VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          notes=$(printf '%s\n' "$notes" | sed -e '/./,$!d')
          # An empty body is a failed extraction, not a release with nothing to
          # say. The verify step already proved the heading exists, so silence
          # here means the reader broke -- ship a loud failure, not a blank
          # release page.
          if [ -z "$notes" ]; then
            echo "Extracted no release body for v$NEW_VERSION from CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --notes "$notes" \
            --verify-tag

  cancel-siblings:
    name: Cancel sibling workflows on failure
    runs-on: ubuntu-latest
    # Same fail-fast contract as validate.yml: if the release verification
    # fails, the remaining workflows of this commit are cancelled rather than
    # left running against a known-red commit. Scoped by head_sha, so runs of
    # other commits and other branches are never touched.
    # `needs:` propagates skips. With `validate` in front, a failed
    # validation leaves should-release, release-gate and create-release
    # all skipped rather than failed, and a bare `failure()` here is
    # skipped too -- so the one job whose entire purpose is to stop the
    # bill on a red commit would never run on a red commit. Ask for
    # validate's outcome explicitly. `!cancelled()` keeps a
    # concurrency-cancelled run from firing this, which is what the
    # original `failure()` was protecting against.
    if: ${{ !cancelled() && (failure() || needs.validate.outcome == 'failure') }}
    needs: [validate, should-release, release-gate, create-release]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel every other run of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Validate is never cancelled. It is the check whose verdict you
          # actually need when something breaks, and it is the longest job in
          # the pipeline, so cancelling it saves the least and costs the most:
          # the run is left `cancelled`, which reads as "something went wrong"
          # without saying what, and the validation evidence is simply gone.
          #
          # Nine of the Validate runs in this repository's history ended
          # `cancelled` rather than reporting a verdict. This loop is what did
          # that. Saving a few runner-minutes is not worth destroying the only
          # signal that distinguishes a bad tree from a bad release.
          #
          # Everything else still gets cancelled, which is the fail-fast the
          # job exists for.
          for status in queued in_progress; do
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=${status}" \
              --jq '.workflow_runs[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
                [ -z "$id" ] && continue
                [ "$id" = "${{ github.run_id }}" ] && continue
                if [ "$name" = "Validate" ]; then
                  echo "leaving run ${id} (${name}) running; it is the verdict"
                  continue
                fi
                echo "cancelling run ${id} (${name})"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/${id}/cancel"
              done
          done
