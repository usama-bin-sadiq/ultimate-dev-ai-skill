name: Sync & Release

# Push to main →
#   1. Regenerate README facts (sync-docs.py: version, counts, agent tree)
#      and auto-commit + push the README if it was stale
#   2. Ensure a GitHub Release + tag exist for ultimate-dev/VERSION, using
#      that version's changelog section as notes (no-op if already released)
#
# Sync runs BEFORE the release so there is no race between "fix README"
# and "verify README" — one job, sequential steps.
# The sync step doubles as the gate: it exits non-zero on drift it cannot
# fix (missing managed line, skill-manifest.yaml out of date).
# Auto-commits carry [skip ci] (and GITHUB_TOKEN pushes never re-trigger
# workflows), so this cannot loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release mid-flight; queue behind any in-progress run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sync-and-release:
    name: Sync README & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync README with repo facts
        run: python3 ultimate-dev/scripts/sync-docs.py

      - name: Auto-commit synced README
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- ultimate-dev/README.md; then
            echo "README already in sync — nothing to commit."
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultimate-dev/README.md
          git commit -m "docs: auto-sync README with repo state [skip ci]"
          git push
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Pushed README sync commit."

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < ultimate-dev/VERSION)"
          TAG="v${VERSION}"
          CHANGELOG="ultimate-dev/changelog/CHANGELOG.md"
          README_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/ultimate-dev/README.md"
          # Tag the synced state if a fix commit was pushed, else this push.
          TARGET="${{ steps.commit.outputs.target }}"

          # Already released? Nothing to do.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping."
            exit 0
          fi

          # Extract this version's changelog section (header line dropped,
          # leading blank lines stripped).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' "$CHANGELOG" | awk 'NF { seen = 1 } seen' > notes.md

          if [ ! -s notes.md ]; then
            {
              echo "No \`## [${VERSION}]\` entry found in \`${CHANGELOG}\`."
              echo ""
              echo "See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/${CHANGELOG})."
            } > notes.md
          fi

          {
            echo ""
            echo "---"
            echo "**Install:** \`./scripts/install.sh --project .\` — see the [README](${README_URL})"
          } >> notes.md

          gh release create "$TAG" \
            --target "$TARGET" \
            --title "ultimate-dev ${TAG}" \
            --notes-file notes.md

          echo "Created release ${TAG}"
