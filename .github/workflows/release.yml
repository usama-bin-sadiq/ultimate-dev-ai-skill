name: Sync & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          cd ultimate-dev
          current=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.version_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          echo "$new_version" > VERSION
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "old_version=$current" >> $GITHUB_OUTPUT

      - name: Generate manifest
        run: |
          cd ultimate-dev
          python scripts/generate-manifest.py

      - name: Sync docs
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py

      - name: Update changelog
        run: |
          cd ultimate-dev
          date_str=$(date +%Y-%m-%d)
          # Prepend new version to changelog
          tmp=$(mktemp)
          echo "# Changelog" > "$tmp"
          echo "" >> "$tmp"
          echo "## [${{ steps.version.outputs.new_version }}] — $date_str" >> "$tmp"
          echo "" >> "$tmp"
          echo "### Changed" >> "$tmp"
          echo "- Version bump to ${{ steps.version.outputs.new_version }}" >> "$tmp"
          echo "" >> "$tmp"
          cat changelog/CHANGELOG.md >> "$tmp"
          mv "$tmp" changelog/CHANGELOG.md

      - name: Commit changes
        run: |
          git add ultimate-dev/VERSION ultimate-dev/skill-manifest.yaml ultimate-dev/README.md ultimate-dev/changelog/CHANGELOG.md
          git commit -m "chore: release v${{ steps.version.outputs.new_version }}"

      - name: Create tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"

      - name: Push changes
        run: |
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          name: "v${{ steps.version.outputs.new_version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}