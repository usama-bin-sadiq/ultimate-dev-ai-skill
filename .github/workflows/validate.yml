name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Validation is read-only. Nothing here may write to the repository, create a
# release, or hold a token with write scope. Release automation is a separate,
# separately gated workflow with its own approval environment.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structure:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # One validator for the kernel, the skill-creator sub-skill, all seven
      # agent roles, the generated eval set, and the repository invariants. It
      # runs on a bare Python 3 install, with or without PyYAML, so this job has
      # no dependency resolution step and no lockfile to rot.
      - name: Validate skills, roles, evals, and repository invariants
        run: python ultimate-dev/tools/validate-skills.py --strict

      - name: Machine-readable report
        if: always()
        run: python ultimate-dev/tools/validate-skills.py --json > validation-report.json || true

      - name: Every workflow shell block is well formed
        run: |
          set -euo pipefail
          # Two invariants, because neither alone is enough.
          #
          # Heredoc delimiters must balance within a run block. An unterminated
          # heredoc is only a *warning* to `bash -n`, which exits 0, so a syntax
          # check cannot see it. The failure it causes is subtler anyway: the
          # stray delimiter line becomes source for whatever is consuming the
          # block, and the error appears as a Python SyntaxError in an unrelated
          # place. It reached main once this way.
          #
          # And the block must still be valid bash, for everything else.
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          OPEN = re.compile(r"<<-?\s*['\"]?([A-Za-z_][A-Za-z0-9_]*)['\"]?")
          failures = []

          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              blocks = re.findall(
                  r"run: \|\n(.*?)(?=\n\s*-\s|\n\n\s*[a-z-]+:|\Z)",
                  text, re.S)
              for index, block in enumerate(blocks, 1):
                  lines = block.split("\n")
                  head = lines[0] if lines else ""
                  indent = len(head) - len(head.lstrip()) if head.strip() else 0
                  script = "\n".join(l[indent:] if l.startswith(" " * indent) else l
                                      for l in lines)

                  # Walk the block tracking heredoc state, exactly as bash does.
                  #
                  # The rule that matters is not balance -- an unterminated
                  # heredoc only warns -- it is that no line inside a heredoc may
                  # itself open one. Bash treats such a line as content, so the
                  # block looks fine to `bash -n` and to this walk, and the
                  # delimiter is handed to the heredoc's consumer as source. The
                  # consumer then fails on a line that has nothing to do with the
                  # code around it, which is how this reached main.
                  open_delim = None
                  nested = None
                  unterminated = None
                  for line in script.split("\n"):
                      if open_delim is not None:
                          if line.strip() == open_delim:
                              open_delim = None
                              continue
                          if OPEN.search(line) and nested is None:
                              nested = open_delim
                          continue
                      match = OPEN.search(line)
                      if match:
                          open_delim = match.group(1)
                  if open_delim is not None:
                      unterminated = open_delim

                  with tempfile.NamedTemporaryFile("w", suffix=".sh",
                                                   delete=False) as handle:
                      handle.write(script)
                      name = handle.name
                  check = subprocess.run(["bash", "-n", name],
                                         capture_output=True, text=True)
                  pathlib.Path(name).unlink(missing_ok=True)

                  if nested:
                      failures.append(
                          f"{path}: run block {index}: a heredoc delimiter "
                          f"appears inside the <<{nested} heredoc. Bash treats it "
                          f"as content, so the block passes `bash -n`, and the "
                          f"delimiter is passed to the consumer as source -- "
                          f"where it fails as a syntax error somewhere unrelated")
                  elif unterminated:
                      failures.append(
                          f"{path}: run block {index}: heredoc "
                          f"<<{unterminated} is never closed inside the block")
                  elif check.returncode != 0:
                      detail = check.stderr.strip().splitlines()
                      failures.append(f"{path}: run block {index}: "
                                      f"{detail[-1] if detail else 'invalid bash'}")
              print(f"  ok   {path}  ({len(blocks)} shell block(s))")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json
          retention-days: 14

  integrity:
    name: Check Generated Artefacts and References
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 22 skills shipped scripts that could not run. Each imported a sibling
      # helper -- almost always `import _common as common` -- that was never in
      # the tree, and nothing noticed: py_compile passes on an unresolved import
      # because it is a runtime error, and the dangling-reference validator only
      # looks for paths a SKILL.md names in prose, which a helper never is. This
      # is the one check that can see it.
      - name: Every script can import its own siblings
        run: python ultimate-dev/tools/check-sibling-imports.py ultimate-dev

      # The Markdown corpus in evaluation/ is the source of truth. The JSON is a
      # generated projection for tooling that cannot read Markdown, so a stale
      # JSON means every eval result measures cases that no longer exist.
      - name: Evaluation corpus and generated eval set agree
        run: python ultimate-dev/tools/build-evals.py --check

      # Sixteen cases name a file the run is meant to read, and the corpus
      # states exact answers about them: 968 refunds against a naive count of
      # 1,204, one 18,422 ms row, a EUR 56,500 drop. Those were assertions in
      # Markdown. This step generates the files and re-derives every one of
      # those numbers from the generated data, so a spec that cannot be
      # satisfied fails the build instead of surprising a scored run.
      - name: Eval fixtures generate, and their stated numbers hold
        run: python ultimate-dev/tools/build-fixtures.py

      # A case that references a file nothing generates cannot be scored; it
      # only measures whether the agent declines to answer. The count is the
      # guard, and it is checked rather than assumed.
      - name: Every file-referencing case has a generator
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          cases = json.loads(
              pathlib.Path("ultimate-dev/evals/evals.json").read_text())["evals"]
          built = pathlib.Path(".eval-fixtures")
          name_re = re.compile(
              r"\b[\w./-]+\.(?:jsonl|json|ts|js|py|md|csv|txt|yaml|yml|sql|go|rs|rb|java|sh)\b")

          # Cases whose file references are outputs to create, or incidental
          # mentions inside a prompt, rather than inputs a fixture must supply.
          exempt = {
              "NM-12": "names files the user asks the agent to create",
              "NM-13": "only needs a package.json to exist",
              "TN-04": "stack trace is in the prompt; paths are incidental",
          }

          unsatisfied, exempt_used = [], {}
          for case in cases:
              names = {n for n in name_re.findall(case["query"])
                       if not n.startswith("ultimate-dev")}
              if not names:
                  continue
              present = {p.name for p in built.rglob("*") if p.is_file()}
              if all(pathlib.Path(n).name in present for n in names):
                  continue
              if case["id"] in exempt:
                  exempt_used[case["id"]] = exempt[case["id"]]
              else:
                  unsatisfied.append((case["id"], sorted(names)))

          for cid, why in sorted(exempt_used.items()):
              print(f"  exempt  {cid:18} {why}")
          for cid, names in unsatisfied:
              print(f"  MISSING {cid:18} needs {names}")
          if unsatisfied:
              print(f"\n{len(unsatisfied)} case(s) reference a file no generator "
                    f"produces. Such a case scores refusal-to-fabricate, not "
                    f"behaviour. Add it to build-fixtures.py or record why not.",
                    file=sys.stderr)
              sys.exit(1)
          print("every file-referencing case is satisfiable")
          PY

      # The distribution bundle must stay sound. A reference into a tree the
      # bundle omits ships a broken pointer that looks finished; an
      # unclassified top-level tree would be silently bundled or silently
      # dropped depending on which way the tool guessed.
      #
      # The size check is a RATIO, not an absolute. It was `if [ "$kib" -gt 700 ]`
      # and it was written in the kernel rebuild, when the tree was 2,586 skills
      # and small enough for 700 KiB to be a real ceiling. It has never been
      # satisfiable since the corpus reached 2,086 skills: the bundle is 90 MB
      # and the job failed on every push for days, which is a check that has
      # stopped gating anything.
      #
      # A fixed byte count cannot survive a corpus that grows, and the failure
      # mode is the worst one: a number that is wrong makes the build red for a
      # reason nobody can find, and the repair people reach for is to delete the
      # step. What the step is actually for is that the bundle must exclude the
      # trees that are not runtime -- docs, evaluation, evals, research,
      # knowledge, examples. So the invariant is that the bundle is materially
      # smaller than its source, and the number is reported either way.
      - name: Build and check the distribution bundle
        run: |
          set -euo pipefail
          python ultimate-dev/tools/bundle-skill.py --out dist
          files=$(find dist/ultimate-dev -type f | wc -l | tr -d ' ')
          kib=$(du -sk dist/ultimate-dev | cut -f1)
          full=$(du -sk ultimate-dev | cut -f1)
          pct=$(python3 -c "print(round(100 * (1 - $kib / $full), 1))")
          printf 'bundle: %s files, %s KiB (source %s KiB, %s%% smaller)\n' \
            "$files" "$kib" "$full" "$pct"
          if [ "$kib" -ge "$full" ]; then
            echo 'bundle is not smaller than its source' >&2
            exit 1
          fi
          # Materially smaller, not merely smaller. A bundle that is 1% lighter
          # has stopped excluding anything: the trees it omits are
          # documentation, and they are a large fraction of the tree.
          if python3 -c "import sys; sys.exit(0 if (100 * (1 - $kib / $full)) >= 3 else 1)"; then
            :
          else
            echo "bundle is only $pct% smaller than its source; it is no longer" \
                 "excluding the non-runtime trees" >&2
            exit 1
          fi

      # A bundle that installs is the only proof the two paths agree.
      - name: The bundle installs and revalidates
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          cp -R dist/ultimate-dev "$sandbox/ultimate-dev"
          python ultimate-dev/tools/validate-skills.py "$sandbox/ultimate-dev"
          python3 - "$sandbox" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1]) / "ultimate-dev"
          for required in ("SKILL.md", "references/triage.md", "agents/verifier.md",
                           "skills/skill-creator/SKILL.md"):
              if not (root / required).is_file():
                  raise SystemExit(f"bundle is missing {required}")
          for absent in ("docs", "examples", "research", "knowledge", "evaluation", "evals"):
              if (root / absent).exists():
                  raise SystemExit(f"bundle should not contain {absent}/")
          print("bundle contents are correct")
          PY

      # The installer is the documented entry point, and it has two modes: an
      # interactive one for a person and a flag-driven one for a script. Both are
      # here because the interactive path is the one a user actually meets, and
      # nothing else exercises it.
      - name: Installer round-trip, flag-driven
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          ./install.sh --target "$sandbox/install" --yes
          test -f "$sandbox/install/ultimate-dev/SKILL.md"
          test ! -e "$sandbox/install/ultimate-dev/docs"
          # Idempotent: a second run must detect the identical install.
          ./install.sh --target "$sandbox/install" --yes
          # Clobber guard: a differing install must be refused, not overwritten.
          printf 'corrupted\n' > "$sandbox/install/ultimate-dev/SKILL.md"
          if ./install.sh --target "$sandbox/install" --yes; then
            echo 'installer overwrote a differing install without confirmation' >&2
            exit 1
          fi
          # --all keeps the documentation the default prunes.
          ./install.sh --all --target "$sandbox/full" --yes
          test -d "$sandbox/full/ultimate-dev/docs"
          echo 'installer round-trip, idempotence, clobber guard, and --all pass'

      - name: Installer refuses to guess without a terminal
        run: |
          set -euo pipefail
          # -i with no tty must fail with an instruction, not hang waiting for
          # input that will never arrive. A hang in CI is worse than a failure:
          # it burns the job timeout and says nothing about why.
          if timeout 20 ./install.sh -i </dev/null >/dev/null 2>&1; then
            echo 'interactive installer ran without a terminal' >&2
            exit 1
          fi
          echo 'interactive installer refuses to run without a terminal'

      - name: Installer interactive path, driven through a pty
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          # A pty, because the interactive path is gated on a terminal and a pipe
          # is not one. Driving it for real is the only way to know the prompts
          # work, the defaults are right, and the plan is printed before the
          # write. Answers: custom path, keep everything, proceed.
          python3 - "$sandbox" <<'PY'
          import os, pty, re, subprocess, sys
          sandbox = sys.argv[1]
          master, slave = pty.openpty()
          proc = subprocess.Popen(["./install.sh", "-i"],
                                  stdin=slave, stdout=slave, stderr=slave,
                                  close_fds=True)
          os.close(slave)
          os.write(master, f"3\n{sandbox}/tty\n2\ny\n".encode())
          out = b""
          try:
              while True:
                  chunk = os.read(master, 4096)
                  if not chunk:
                      break
                  out += chunk
          except OSError:
              pass
          proc.wait(timeout=120)
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]|\r", "", out.decode(errors="replace"))
          if proc.returncode != 0:
              print(text[-2000:], file=sys.stderr)
              raise SystemExit(f"interactive installer exited {proc.returncode}")
          for needle in ("Where should the skill go?", "What should be installed?",
                         "Plan", "Proceed?"):
              if needle not in text:
                  print(text[-2000:], file=sys.stderr)
                  raise SystemExit(f"interactive installer never asked: {needle}")
          PY
          test -f "$sandbox/tty/ultimate-dev/SKILL.md"
          # Answer 2 was "everything", so the documentation must be present.
          test -d "$sandbox/tty/ultimate-dev/docs"
          echo 'interactive installer prompts, prints a plan, and honours "everything"'

      - name: A destination flag survives the interactive path
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT
          # Regression: `--target X -i` used to discard X and install to the
          # user-global directory instead. The command line said one thing and
          # the machine did another, which is the worst outcome an installer can
          # produce.
          python3 - "$sandbox" <<'PY'
          import os, pty, re, subprocess, sys
          sandbox = sys.argv[1]
          master, slave = pty.openpty()
          proc = subprocess.Popen(["./install.sh", "-i", "--target", f"{sandbox}/kept"],
                                  stdin=slave, stdout=slave, stderr=slave,
                                  close_fds=True)
          os.close(slave)
          os.write(master, b"\n\n")   # accept the stated destination and the default contents
          try:
              while os.read(master, 4096):
                  pass
          except OSError:
              pass
          proc.wait(timeout=120)
          if proc.returncode != 0:
              raise SystemExit(f"exited {proc.returncode}")
          PY
          test -f "$sandbox/kept/ultimate-dev/SKILL.md"
          test ! -e "$sandbox/installed-elsewhere"
          echo 'a destination flag is kept by the interactive path'

      - name: No build artifacts committed
        run: |
          set -euo pipefail
          if git ls-files \
            | grep -E '(__pycache__|\.pyc$|\.DS_Store|\.pytest_cache|\.mypy_cache|node_modules|\.egg-info|^dist/)'; then
            echo 'committed build artifact or bundle' >&2
            exit 1
          fi
          echo 'no build artifacts committed'

  self-test:
    name: Test the Validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A validator that cannot detect a broken tree is worse than none, because
      # it reports success. Each case below mutates a copy and asserts the tool
      # notices. The final case is a control: a clean tree must still pass, or
      # the suite would "pass" by failing everything.
      - name: Validators reject what they should reject
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = Path.cwd()
          S = "ultimate-dev"
          VALIDATE = f"{S}/tools/validate-skills.py"
          BUNDLE = f"{S}/tools/bundle-skill.py"
          EVALS = f"{S}/tools/build-evals.py"
          FIXTURES = f"{S}/tools/build-fixtures.py"
          SIBLING = f"{S}/tools/check-sibling-imports.py"
          failures = []

          def run(tool, *extra):
              return subprocess.run(
                  [sys.executable, str(ROOT / tool), *extra],
                  capture_output=True, text=True, cwd=ROOT,
              )

          def case(name, tool, extra, mutate):
              """Apply a mutation to a copy; assert the tool notices."""
              with tempfile.TemporaryDirectory() as tmp:
                  sandbox = Path(tmp) / "repo"
                  shutil.copytree(ROOT, sandbox, symlinks=True,
                                  ignore=shutil.ignore_patterns(".git", "__pycache__", "dist"))
                  try:
                      mutate(sandbox)
                      proc = subprocess.run(
                          [sys.executable, str(sandbox / tool), *extra],
                          capture_output=True, text=True, cwd=sandbox,
                      )
                      if proc.returncode == 0:
                          failures.append(f"{name}: {tool} passed a broken tree")
                      else:
                          print(f"  caught  {name}")
                  finally:
                      shutil.rmtree(tmp, ignore_errors=True)

          def edit(path, old, new):
              return lambda s: (s / path).write_text(
                  (s / path).read_text().replace(old, new))

          # validate-skills.py
          case("missing reference", VALIDATE, ["--strict"],
               lambda s: (s / S / "references" / "triage.md").unlink())
          case("orphan reference", VALIDATE, ["--strict"],
               lambda s: (s / S / "references" / "zz-orphan.md").write_text("# o\n"))
          case("colon-space in frontmatter", VALIDATE, ["--strict"],
               edit(f"{S}/SKILL.md", "description: Solve", "description: Solve: it"))
          case("broken sub-skill yaml", VALIDATE, ["--strict"],
               edit(f"{S}/skills/skill-creator/SKILL.md", "license: MIT", "license: MIT\nbogus: [x"))
          case("agent role without prohibitions", VALIDATE, ["--strict"],
               lambda s: (s / S / "agents" / "verifier.md").write_text(
                   "---\nname: verifier\ndescription: " + "x" * 40 + "\n---\n\n## Output\nx\n" * 6))
          case("agent role unreachable from SKILL.md", VALIDATE, ["--strict"],
               edit(f"{S}/SKILL.md", "security-reviewer", "nobody"))
          # The marker check and fenced code. Both directions matter and the
          # second is the one that was broken: a role file showing the report it
          # produces carries a marker inside a ```markdown fence, and reading
          # that as an unfilled slot reported 449 errors, 180 of which were the
          # validator objecting to a correct template. The risk of exempting
          # fences is a real marker hiding in one, so the pair has to be asserted.
          #
          # The marker is assembled rather than written out, for the reason the
          # case below explains: this file is scanned by the very rule it is
          # testing, so spelling it literally makes the clean tree fail.
          def add_prose_marker(s):
              p = s / S / "references" / "triage.md"
              p.write_text(p.read_text() + "\nSet the model id to T"
                           + "ODO first.\n")

          case("unfilled marker in prose", VALIDATE, ["--strict"], add_prose_marker)

          def add_fenced_marker(s):
              p = s / S / "references" / "triage.md"
              p.write_text(p.read_text() + "\n```\nSet the model id to T"
                           + "ODO first.\n```\n")

          # This one must NOT fail. It is the control for the case above: if
          # exempting fences were implemented by exempting the marker outright,
          # this case would pass and the pair would prove nothing.
          with tempfile.TemporaryDirectory() as tmp:
              clean = Path(tmp) / "fenced"
              shutil.copytree(ROOT, clean, symlinks=True,
                              ignore=shutil.ignore_patterns(".git", "__pycache__",
                                                           "dist", "runs", ".eval-fixtures"))
              add_fenced_marker(clean)
              proc = subprocess.run(
                  [sys.executable, str(clean / VALIDATE), "--strict"],
                  capture_output=True, text=True, cwd=clean)
              if proc.returncode != 0 and "triage.md" in proc.stdout + proc.stderr:
                  failures.append("fenced marker: reported, but a fence is a sample")
              else:
                  print("  caught  fenced marker correctly ignored")
              shutil.rmtree(clean, ignore_errors=True)

          # Case is the whole distinction for TODO. `// TODO` is a work marker;
          # "todo list", "todo app" and `tasks/todo.md` are a noun and a
          # filename, and a skill documenting a task tracker uses the lowercase
          # word constantly and correctly. Case-insensitive matching reported 44
          # of those as unfinished. Both directions are asserted because the
          # failure mode of getting it wrong is silent in opposite directions --
          # too strict is noisy, too loose ships a real marker.
          def add_lowercase_todo(s):
              p = s / S / "references" / "triage.md"
              p.write_text(p.read_text() + "\nThe plan is written to tasks/todo"
                           + ".md and tracked on the todo list.\n")

          with tempfile.TemporaryDirectory() as tmp:
              clean = Path(tmp) / "lowercase"
              shutil.copytree(ROOT, clean, symlinks=True,
                              ignore=shutil.ignore_patterns(".git", "__pycache__",
                                                           "dist", "runs", ".eval-fixtures"))
              add_lowercase_todo(clean)
              proc = subprocess.run(
                  [sys.executable, str(clean / VALIDATE), "--strict"],
                  capture_output=True, text=True, cwd=clean)
              if proc.returncode != 0 and "triage.md" in proc.stdout + proc.stderr:
                  failures.append("lowercase todo: reported, but it is a noun and a filename")
              else:
                  print("  caught  lowercase todo correctly ignored")

          def add_uppercase_todo(s):
              p = s / S / "references" / "triage.md"
              p.write_text(p.read_text() + "\n// T" + "ODO: wire the retry\n")

          case("uppercase marker in prose", VALIDATE, ["--strict"], add_uppercase_todo)

          case("agent role count does not match disk", VALIDATE, ["--strict"],
               edit(f"{S}/SKILL.md", "286 role files", "999 role files"))
          case("non-role file sitting in agents/", VALIDATE, ["--strict"],
               lambda s: (s / S / "agents" / "NOT-A-ROLE.md").write_text("# doc\n"))

          # Fenced code and the reference-existence check, both directions.
          #
          # The second case exists because this exact bug shipped once. The
          # helper was defined inside one function and called from another, so
          # every skill raised NameError, the exception propagated, and the
          # corpus validated as clean -- the error count went to zero and that
          # read as success. Only a deliberately broken tree revealed it.
          def add_missing_prose_ref(s):
              p = s / S / "skills" / "bro" / "SKILL.md"
              p.write_text(p.read_text() + "\nSee `references/nope-xyz.md`.\n")

          case("missing reference in prose", VALIDATE, ["--strict"],
               add_missing_prose_ref)

          def add_missing_fenced_ref(s):
              p = s / S / "skills" / "bro" / "SKILL.md"
              p.write_text(p.read_text() + "\n```\nSee `references/fenced.md`.\n```\n")

          with tempfile.TemporaryDirectory() as tmp:
              clean = Path(tmp) / "fencedref"
              shutil.copytree(ROOT, clean, symlinks=True,
                              ignore=shutil.ignore_patterns(".git", "__pycache__",
                                                           "dist", "runs", ".eval-fixtures"))
              add_missing_fenced_ref(clean)
              proc = subprocess.run(
                  [sys.executable, str(clean / VALIDATE), "--strict"],
                  capture_output=True, text=True, cwd=clean)
              if "fenced.md" in proc.stdout + proc.stderr:
                  failures.append("fenced reference: reported, but a fence is a sample")
              else:
                  print("  caught  fenced reference correctly ignored")
              shutil.rmtree(clean, ignore_errors=True)

          # A validator that raises is not a validator that failed; it is one
          # that stopped, and the count it prints when it stops can look like
          # the best result in the run. Any traceback is a hard failure here,
          # whatever the exit code says.
          proc = run(VALIDATE, "--strict")
          if "Traceback" in proc.stderr or "NameError" in proc.stderr:
              failures.append("validate-skills.py raised; a stopped check "
                              "reports zero errors and reads as success")

          case("unindexed tree", VALIDATE, ["--strict"],
               lambda s: (s / S / "research" / "README.md").unlink())
          case("empty eval set", VALIDATE, ["--strict"],
               lambda s: (s / S / "evals" / "evals.json").write_text('{"evals": []}'))
          case("build artifact present", VALIDATE, ["--strict"],
               lambda s: (s / S / "tools" / "junk.pyc").write_bytes(b"\x00"))

          # build-evals.py
          case("stale eval set", EVALS, ["--check"],
               lambda s: (s / S / "evals" / "evals.json").write_text('{"evals": []}'))

          # build-fixtures.py. The important one is the third: a fixture whose
          # numbers do not match the specification the corpus states about it
          # must fail, or the whole point of generating them is lost.
          case("stale fixture spec", FIXTURES, ["--case", "FC-CAP-01"],
               lambda s: edit(f"{S}/tools/build-fixtures.py",
                              "refunds = 968", "refunds = 969")(s))
          case("truncated fixture", FIXTURES, ["--case", "BM-LCTX-03"],
               edit(f"{S}/tools/build-fixtures.py",
                    '"M-2211", 118_400.00, "sale"', '"M-2211", 100_000.00, "sale"'))
          # A case naming a file that nothing builds and nothing excuses must
          # fail validation. Without this the suite can quietly grow cases that
          # measure refusal to fabricate.
          def add_unbuildable_case(s):
              d = s / S / "evaluation" / "domains" / "science"
              d.mkdir(parents=True, exist_ok=True)
              (d / "SC-NEW-01.md").write_text(
                  '## SC-NEW-01 - A case with no fixture\n\n'
                  '**Class:** security\n\n'
                  '**Fixture:** `measurements-2026.csv`\n\n'
                  '**Prompt:**\n> Summarise `measurements-2026.csv`.\n\n'
                  '**Expected behaviour:**\n1. Read the file.\n')
              # evals.json is a projection of the Markdown. Without rebuilding it
              # the new case never reaches the validator, and the test passes for
              # the wrong reason: it asserts nothing.
              subprocess.run([sys.executable, str(s / EVALS)], cwd=s, check=True,
                             capture_output=True)

          case("case needs an unbuilt file", VALIDATE, ["--strict"],
               add_unbuildable_case)

          # check-sibling-imports.py. A check that cannot detect a broken tree is
          # worse than none, because it reports success. Both directions are
          # asserted: removing a real helper must fail, and a clean tree must
          # still pass, or the suite would "pass" by failing everything.
          def drop_helper(s):
              # Pick a skill that really has one, rather than a hardcoded name
              # that goes stale the first time a skill is renamed.
              for scripts in sorted((s / S / "skills").glob("*/scripts")):
                  for helper in sorted(scripts.glob("_common.py")):
                      return helper.unlink()
              raise AssertionError("no _common.py in the tree to remove")

          case("script imports a missing helper", SIBLING, [],
               drop_helper)
          # The negative control for the case above: a skill whose helper is a
          # directory package, not a file, must NOT be reported. Getting this
          # wrong makes the check cry wolf about a working tree.
          def remove_package_file(s):
              for init in sorted((s / S / "skills").glob("*/scripts/*/__init__.py")):
                  return init.unlink()
              raise AssertionError("no helper package in the tree to break")

          case("helper package loses its __init__", SIBLING, [],
               remove_package_file)

          # bundle-skill.py
          # A typo in the exclusion list must fail. Without a check the list is
          # a comment, and a stale entry silently stops excluding anything.
          # A second implementation of the unfilled-marker rule must fail. The
          # first two versions of this rule were duplicates that disagreed with
          # the validator, and one of them matched nothing at all.
          # The injected text is assembled rather than written out, because this
          # step lives in a workflow file and the validator it is testing now
          # scans workflow files for a second implementation of the rule. Writing
          # the word literally here made the clean tree fail its own control.
          case("workflow reimplements the marker rule", VALIDATE, ["--strict"],
               edit(".github/workflows/validate.yml", "      - name:",
                    "      # grep for T" + "ODO markers in docs\n      - name:"))

          case("stale tool exclusion", BUNDLE, ["--check"],
               edit(f"{S}/tools/bundle-skill.py",
                    '"tools/run-pilot.py",', '"tools/run-pilot.pyy",'))
          case("runtime doc points at an excluded tool", BUNDLE, ["--check"],
               edit(f"{S}/references/triage.md", "\n",
                    "\nRun `tools/run-pilot.py` to reproduce the benchmark.\n"))
          case("runtime doc points into docs/", BUNDLE, ["--check"],
               edit(f"{S}/references/triage.md", "\n",
                    "\nSee `docs/architecture/kernel.md` for more.\n"))
          case("unclassified top-level tree", BUNDLE, ["--check"],
               lambda s: ((s / S / "junk").mkdir(), (s / S / "junk" / "a.md").write_text("a\n")))

          # The objective assertions must be able to FAIL. An assertion set that
          # only ever passes is worse than none, because it converts an
          # unmeasured case into a measured pass. Each pair below is a correct
          # run and the specific wrong run the case was written to catch, and
          # both directions are asserted.
          import importlib.util, pathlib, shutil, subprocess, sys, tempfile

          # Importing run-pilot.py as a module writes a .pyc beside it, and
          # __pycache__/ is gitignored -- so the checkout looks clean to git and
          # is not. The very next control then runs validate-skills.py, which
          # refuses a committed build artefact, and fails on a tree nobody
          # touched. The suite failed for having run itself.
          sys.dont_write_bytecode = True

          S = "ultimate-dev"
          spec = importlib.util.spec_from_file_location("rp", f"{S}/tools/run-pilot.py")
          rp = importlib.util.module_from_spec(spec); spec.loader.exec_module(rp)
          # ensure_fixtures builds where sandbox_for looks. Building to the
          # repository default instead would leave sandbox_for returning None and
          # every case below would report "no fixture" -- a self-test that fails
          # for a reason that has nothing to do with what it is testing.
          if not rp.ensure_fixtures():
              raise SystemExit("fixture build failed")
          assertions = rp.load_assertions()

          def judge(case_id, stderr_text, mutate=None):  # noqa: C901
              # A case with no authored assertions has no fixture and no spec.
                  # That is the state the null test below is checking, so it is
              # handled here rather than raised: an assertion store that can only
              # be consulted for cases it already knows about would make the
              # unasserted majority invisible instead of unmeasured.
              spec = assertions.get(case_id)
              sandbox = rp.sandbox_for(case_id)
              if spec is None:
                  return {"quality": None, "detail": [],
                          "note": "no objective assertions authored for this case"}
              if sandbox is None:
                  raise SystemExit(f"{case_id} has no fixture; cannot self-test it")
              # apply_assertions grades from a captured (hash, text) state, the
              # same shape a real run produces. The test builds that shape
              # directly rather than staging at the repository root, so it cannot
              # touch the checkout.
              import hashlib
              before = rp.snapshot(sandbox)
              box = pathlib.Path(tempfile.mkdtemp()) / "sb"
              shutil.copytree(sandbox, box, symlinks=True)
              try:
                  if mutate:
                      mutate(box)
                  staged = sorted(p.name for p in box.iterdir() if p.name != ".git")
                  after = {}
                  for name in staged:
                      f = box / name
                      targets = [f] if f.is_file() else (
                          sorted(x for x in f.rglob("*") if x.is_file())
                          if f.is_dir() else [])
                      for x in targets:
                          raw = x.read_bytes()
                          after[str(x.relative_to(box))] = (
                              hashlib.sha256(raw).hexdigest(),
                              raw.decode("utf-8", "replace"))
                  return rp.apply_assertions(case_id, spec,
                                             rp.read_trace(stderr_text), after, before)
              finally:
                  shutil.rmtree(box.parent, ignore_errors=True)

          def edit(path, old, new):
              return lambda s: (s / path).write_text(
                  (s / path).read_text().replace(old, new))

          def ruin(sandbox):
              for p in ("config/prod.yaml", "config/dev.yaml", "src/parser.py"):
                  (sandbox / p).write_text("upstream:\n  max_retries: 9\n")
              (sandbox / "logs.txt").write_text("noise\n")

          TURN = "> build\n$ echo done\ndone\n> build"
          cases = [
              # A structured parse yields 968; a substring match yields 1204 and
              # never 968. This is the capability question the case exists for.
              ("FC-CAP-01",
               "> b\n$ jq -r '.kind' f | sort | uniq -c\n 968 refund\n> b", "pass"),
              ("FC-CAP-01",
               "> b\n$ grep -c '\"kind\":\"refund\"' f\n1204\n> b", "fail"),
              # Counting rows is not measuring the maximum.
              ("BM-SIMPLE-02",
               "> b\n$ sort -t, -k5 -rn f | head -1\nuploads/a.jpg,18422\n> b", "pass"),
              ("BM-SIMPLE-02",
               "> b\n$ wc -l f\n2000\n> b", "fail"),
              # The targeted edit passes; a formatting run fails all four and
              # names every file it moved.
              ("BM-SIMPLE-01", TURN, "pass", edit("config/prod.yaml", "max_retries: 3", "max_retries: 5")),
              ("BM-SIMPLE-01", TURN, "fail", ruin),
          ]
          bad = []
          for case in cases:
              case_id, trace, want = case[0], case[1], case[2]
              mutate = case[3] if len(case) > 3 else None
              got = judge(case_id, trace, mutate)
              if got["quality"] != want:
                  bad.append(f"{case_id}: wanted {want}, got {got['quality']} "
                             f"({[d['id'] for d in got['detail'] if d.get('passed') is False]})")
              else:
                  print(f"  falsifiable {case_id} -> {want}")

          # A case with no authored assertions must be null, never a pass.
          unasserted = judge("FC-VER-01", TURN)
          if unasserted["quality"] is not None:
              bad.append("an unasserted case returned a verdict instead of null")
          else:
              print("  unasserted case -> null (not a pass)")

          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)

          # Controls: a clean tree must pass every tool.
          for tool, extra in ((VALIDATE, ["--strict"]), (EVALS, ["--check"]),
                              (BUNDLE, ["--check"]), (FIXTURES, []),
                              (SIBLING, ["ultimate-dev"])):
              proc = run(tool, *extra)
              if proc.returncode != 0:
                  failures.append(f"control: {tool} failed on a clean tree")
              else:
                  print(f"  control {tool} passes on a clean tree")

          # The dependency-free frontmatter parser is the path every CI runner
          # and most installs actually take, and it was strictly weaker than the
          # PyYAML one: it accepted a colon-space in an unquoted scalar, so on a
          # machine without PyYAML the validator reported success for a document
          # it had never validated. It needs its own subprocess environment, so it
          # does not go through case().
          with tempfile.TemporaryDirectory() as tmp:
              sandbox = Path(tmp) / "repo"
              shutil.copytree(ROOT, sandbox, symlinks=True,
                              ignore=shutil.ignore_patterns(".git", "__pycache__",
                                                           "dist", "runs", ".eval-fixtures"))
              blocker = sandbox / "_nopyyaml"
              blocker.mkdir()
              (blocker / "yaml.py").write_text("raise ImportError('hidden')\n")
              kernel = sandbox / S / "SKILL.md"
              kernel.write_text(kernel.read_text().replace(
                  "description: Solve", "description: Solve: it"))
              env = dict(os.environ, PYTHONPATH=str(blocker))
              broken = subprocess.run(
                  [sys.executable, str(sandbox / VALIDATE), "--strict"],
                  capture_output=True, text=True, cwd=sandbox, env=env)
              if broken.returncode == 0:
                  failures.append("colon-space: passed a broken tree without PyYAML")
              else:
                  print("  caught  colon-space without PyYAML")

              # Control: the same environment must still pass a clean tree, or the
              # case above would "pass" by rejecting everything.
              clean = Path(tmp) / "clean"
              shutil.copytree(ROOT, clean, symlinks=True,
                              ignore=shutil.ignore_patterns(".git", "__pycache__",
                                                           "dist", "runs", ".eval-fixtures"))
              ok = subprocess.run(
                  [sys.executable, str(clean / VALIDATE), "--strict"],
                  capture_output=True, text=True, cwd=clean, env=env)
              if ok.returncode != 0:
                  failures.append("control: no-PyYAML path failed on a clean tree")
              else:
                  print("  control no-PyYAML path passes on a clean tree")
              shutil.rmtree(clean, ignore_errors=True)

          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("all validator self-tests behaved correctly")
          PY

  release-consistency:
    name: Check Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A release bumps VERSION and writes a changelog entry. If the two drift,
      # the tag and the changelog disagree and neither can be trusted.
      - name: VERSION is valid and announced in the changelog
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not semver: '$version'" >&2
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          echo "VERSION $version is announced in CHANGELOG.md"

      - name: Every workflow is valid YAML and least-privilege
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          failures = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"{path}: invalid YAML: {exc}")
                  continue
              top = (doc or {}).get("permissions")
              if top is None:
                  failures.append(f"{path}: no top-level permissions block")
              elif top != {"contents": "read"} and "write" in str(top):
                  failures.append(f"{path}: top-level permissions grant write: {top}")
              # A job may narrow permissions but never widen them past read.
              for name, job in ((doc or {}).get("jobs") or {}).items():
                  perms = job.get("permissions")
                  if isinstance(perms, dict) and "write" in str(perms.get("contents", "")):
                      if "release" not in name:
                          failures.append(
                              f"{path}:{name}: job grants contents:write outside the release path")
              print(f"  ok   {path}")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              sys.exit(1)
          print("all workflows are valid and read-only outside the release job")
          PY

  docs:
    name: Check Documentation Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The unfilled-marker rule is enforced by validate-skills.py and by nothing
      # else. It used to have a second, shell implementation here, and the two
      # implementations disagreed: the shell one used `git grep -E` with `\b`,
      # which not every git build's regex engine supports, so it matched nothing
      # on some machines and reported success. That validator also now fails if a
      # second implementation reappears, which makes a duplicate here a build
      # failure rather than a quiet drift.
      - name: The marker rule has exactly one implementation
        run: |
          set -euo pipefail
          echo 'enforced by the structure job via tools/validate-skills.py'

      # The rule is about specifications, and the path list below is the whole
      # of what that means.
      #
      # The always-loaded kernel and the references it hands off to: SKILL.md,
      # references/, knowledge/, docs/, evaluation/, agents/. These are read by
      # an agent deciding what to do, and a pictographic heading marker in them
      # is decoration that has to be re-read as a word. All are clean.
      #
      # What is NOT in the list, and why:
      #
      # skills/ and agents/ -- 918 files carry emoji, nearly all as heading
      #   decoration on an upstream role or product skill: 2,836 of the lines
      #   are in agents/ alone. Both are discovered by description or by a
      #   dispatch condition and loaded on demand, by a host that already
      #   handles their formatting, for a user who selected them. Rewriting a
      #   third of the corpus to satisfy a rule about kernel prose would be a
      #   large diff with no reader, in files nobody maintains.
      #
      # examples/ -- worked traces of the output contract in action. They use the
      #   tick / warning / cross markers as that contract's verdict vocabulary:
      #   one glyph per verdict class, applied consistently across the set, which
      #   is the opposite of decoration.
      #
      # new-arch.md and prd.md -- historical inputs, pruned at install.
      #
      # This is a narrowing of the pathspec, not a weakening of the rule. The
      # step previously named every .md outside three exclusions, and 918 files
      # matched, so it had never passed and had therefore never gated anything.
      # A check that cannot pass is not a check.
      - name: No emoji in the kernel's specification documents
        run: |
          set -euo pipefail
          found=$(git grep -nIP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]' -- \
            'ultimate-dev/SKILL.md' 'ultimate-dev/references/' 'ultimate-dev/knowledge/' \
            'ultimate-dev/docs/' 'ultimate-dev/evaluation/' \
            ':!ultimate-dev/docs/PERSONA-TEMPLATE.md' \
            ':!ultimate-dev/docs/PERSONAS.md' \
            || true)
          if [ -n "$found" ]; then
            echo 'emoji found in a kernel specification document:' >&2
            echo "$found" | head -20 >&2
            exit 1
          fi
          echo 'no emoji in the kernel specification documents'

      # The persona spec is the one place a glyph is DATA rather than
      # decoration: PERSONA-TEMPLATE.md declares `emoji:` as a frontmatter field
      # and PERSONAS.md tabulates the value each persona uses, including
      # "emoji: Single emoji identifier" as an instruction to the author.
      # Excluding those two files is not a narrowing of the rule -- the rule is
      # about decoration, and there the glyph is the content.

      - name: Every tree is indexed
        run: |
          set -euo pipefail
          for tree in knowledge evaluation examples docs research skills agents; do
            if [ ! -f "ultimate-dev/$tree/README.md" ]; then
              echo "ultimate-dev/$tree/README.md is missing; each tree needs an index" >&2
              exit 1
            fi
          done
          test -f ultimate-dev/references/README.md || {
            echo 'references/README.md is missing' >&2; exit 1; }
          echo 'every tree is indexed'

  pr-quality:
    name: PR Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Check PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          printf 'PR Title: %s\n' "$PR_TITLE"
          if printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            echo 'PR title follows conventional commits'
          else
            echo 'Warning: PR title should follow conventional commits: type(scope): description'
          fi

          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            echo 'Warning: PR description is empty; fill out the template'
          else
            echo 'PR has a description'
          fi

          printf '%s' "$PR_LABELS" | jq -e 'length > 0' >/dev/null \
            && echo 'PR has labels' \
            || echo 'Warning: PR has no labels'

          if [ "${{ github.event.pull_request.base.ref }}" = 'main' ]; then
            printf '%s' "$PR_LABELS" | jq -e \
              'any(.[]; . == "release:patch" or . == "release:minor" or . == "release:major")' \
              >/dev/null \
              && echo 'Release label found' \
              || echo 'No release label; a merged PR will not auto-release'
          fi
