name: Validate ultimate-dev Skill

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run structure validation
        run: |
          cd ultimate-dev
          python scripts/validate.py

      - name: Run unit tests
        run: |
          cd ultimate-dev
          python -m pytest tests/ -v

      - name: Verify README sync
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py --check

  verify-package:
    name: Verify Package Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run verify.sh
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

  generate-manifest:
    name: Auto-generate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate manifest
        run: |
          cd ultimate-dev
          python scripts/generate-manifest.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet skill-manifest.yaml; then
            echo "⚠️ skill-manifest.yaml is out of sync — run generate-manifest.py locally"
            git diff skill-manifest.yaml
            exit 1
          fi

  sync-docs:
    name: Sync Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Sync docs
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet README.md; then
            echo "⚠️ README.md is out of sync — run sync-docs.py locally"
            git diff README.md
            exit 1
          fi

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test global install
        run: |
          cd ultimate-dev
          ./scripts/install.sh --global --yes

      - name: Verify installation
        run: |
          ls -la ~/.agents/skills/ultimate-dev/
          test -f ~/.agents/skills/ultimate-dev/SKILL.md
          test -f ~/.agents/skills/ultimate-dev/skill-manifest.yaml

      - name: Test project install
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          git init -q
          cp -r $GITHUB_WORKSPACE/ultimate-dev .
          ./ultimate-dev/scripts/install.sh --project . --yes
          test -f .agents/skills/ultimate-dev/SKILL.md
          test -f .gitignore
          grep -q ".memory/ultimate-dev/" .gitignore

  # New: Check PR quality
  pr-quality:
    name: PR Quality Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title follows conventional commits
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          
          # Check for conventional commit format
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            echo "✅ PR title follows conventional commits"
          else
            echo "⚠️ PR title should follow conventional commits: type(scope): description"
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  fix(agent): resolve bug in python-engineer"
            echo "  docs: update installation guide"
            # Don't fail, just warn
          fi

      - name: Check PR has description
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "⚠️ PR description is empty — please fill out the template"
          else
            echo "✅ PR has description"
          fi

      - name: Check PR has labels
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}')
          if [ "$LABELS" = "[]" ]; then
            echo "⚠️ PR has no labels — add at least one: feature, bug, docs, release:patch/minor/major, hotfix, breaking, ci"
          else
            echo "✅ PR has labels: $LABELS"
          fi

      - name: Check for release label if targeting main
        if: github.event.pull_request.base.ref == 'main'
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels.*.name) }}')
          if echo "$LABELS" | grep -qE '"release:(patch|minor|major)"'; then
            echo "✅ Release label found — will auto-release on merge"
          else
            echo "ℹ️ No release label — add 'release:patch', 'release:minor', or 'release:major' to trigger auto-release on merge"
          fi