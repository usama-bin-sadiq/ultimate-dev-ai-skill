name: Validate

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - CHANGELOG.md
      - VERSION
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  structure:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skills, roles, and repository invariants
        run: python ultimate-dev/tools/validate-skills.py --strict
      - name: Routing index is current
        run: python ultimate-dev/tools/build-routing-index.py --check
      - name: Overlap budget (report)
        run: python ultimate-dev/tools/build-routing-index.py --overlap-fail 25 || true
      - name: Skill quality gate
        run: python ultimate-dev/tools/score-skill-quality.py --mean-floor 2.5
      - name: Task graders discriminate
        run: python ultimate-dev/evals/selftest_tasks.py
      - name: No phantom collection prefixes
        run: python ultimate-dev/tools/normalize-collection-refs.py --check
      # Report-only, and the volume is why. Of the 172 remaining findings, the
      # large majority are skills documenting a script or a document that was
      # never written -- `skills/pylabrobot/scripts/validate_manifest.py` and
      # three sibling CLIs are the clearest case: that skill has no scripts/
      # directory at all, and 464 skills reference a scripts/ path. Closing
      # that means writing the corpus or deleting the claims, which is a
      # content decision rather than a link repair, so the check reports and
      # does not gate.
      #
      # The two classes it used to report wrongly are fixed in the tool: a
      # `${CLAUDE_SKILL_DIR}` runtime variable and a bare `URL` in prose. Both
      # were resolved against disk and called broken, when neither is a path.
      - name: Internal references (report only)
        run: python ultimate-dev/tools/check-links.py --quiet || true
      # The dispatcher and the measurement of the dispatcher must not drift, so
      # both self-tests gate. Each mutates the tool it covers and fails if the
      # mutation survives, which is the only way to know a check can fail.
      - name: Router self-tests
        run: |
          python ultimate-dev/tools/test-eval-routing.py
          python ultimate-dev/tools/test-route.py

      # Routing quality is reported on two sets: the one the scorer was
      # developed against, and one written afterwards and never tuned against.
      # Both are printed because the tuned number alone is misleading -- a
      # scorer can be walked to 100% on a fixed 60-query set without improving
      # routing at all. The gap was 18 points when the held-out set was added.
      - name: Routing eval (report only)
        run: python ultimate-dev/tools/eval-routing.py || true
      - name: Sibling imports resolve
        run: python ultimate-dev/tools/check-sibling-imports.py ultimate-dev
      - name: Workflow self-tests
        run: |
          python ultimate-dev/tools/test-workflow-auth.py
          python ultimate-dev/tools/check-workflow-auth.py
      - name: Validator self-tests
        run: |
          python ultimate-dev/tools/test-text-rules.py
          python ultimate-dev/tools/test-marker-drift.py
      - name: Installer round-trip
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          ./install.sh --target "$dest" --yes
          test -f "$dest/ultimate-dev/SKILL.md"
          python "$dest/ultimate-dev/tools/validate-skills.py" --strict
