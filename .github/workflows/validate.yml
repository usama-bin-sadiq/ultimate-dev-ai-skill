name: Validate ultimate-dev Skill

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run structure validation
        run: |
          cd ultimate-dev
          python scripts/validate.py

      - name: Run unit tests
        run: |
          cd ultimate-dev
          python -m pytest tests/ -v

      - name: Verify README sync
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py --check

  verify-package:
    name: Verify Package Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run verify.sh
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

  generate-manifest:
    name: Auto-generate Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate manifest
        run: |
          cd ultimate-dev
          python scripts/generate-manifest.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet skill-manifest.yaml; then
            echo "⚠️ skill-manifest.yaml is out of sync — run generate-manifest.py locally"
            git diff skill-manifest.yaml
            exit 1
          fi

  sync-docs:
    name: Sync Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Sync docs
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet README.md; then
            echo "⚠️ README.md is out of sync — run sync-docs.py locally"
            git diff README.md
            exit 1
          fi

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test global install
        run: |
          cd ultimate-dev
          ./scripts/install.sh --global --yes

      - name: Verify installation
        run: |
          ls -la ~/.claude/skills/ultimate-dev/
          test -f ~/.claude/skills/ultimate-dev/SKILL.md
          test -f ~/.claude/skills/ultimate-dev/skill-manifest.yaml

      - name: Test project install
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          git init -q
          ~/ultimate-dev/scripts/install.sh --project . --yes
          test -f .claude/skills/ultimate-dev/SKILL.md
          test -f .gitignore
          grep -q ".memory/ultimate-dev/" .gitignore