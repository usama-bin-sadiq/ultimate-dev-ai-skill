name: Validate ultimate-dev Skill

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Validation is read-only.  Write-capable automation lives in separately gated
# jobs/workflows and never receives a pull-request token.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for host-native JEV tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check workflow security invariants
        run: bash ./ultimate-dev/scripts/validate-workflows.sh

      - name: Run JEV conformance tests
        run: node --test ultimate-dev/tests/jev/engine.test.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "PyYAML==6.0.2" "pytest==8.3.5" "requests==2.32.3"

      - name: Run structure validation
        run: |
          cd ultimate-dev
          python scripts/validate.py

      - name: Run unit tests
        run: |
          cd ultimate-dev
          python -m pytest tests/ -v

      - name: Verify README sync
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py --check

  verify-package:
    name: Verify Package Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run verify.sh
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

  generate-manifest:
    name: Auto-generate Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "PyYAML==6.0.2"

      - name: Generate manifest
        run: |
          cd ultimate-dev
          python scripts/generate-manifest.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet -- skill-manifest.yaml; then
            echo "skill-manifest.yaml is out of sync; run generate-manifest.py locally" >&2
            git diff -- skill-manifest.yaml
            exit 1
          fi

  sync-docs:
    name: Sync Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "PyYAML==6.0.2"

      - name: Sync docs
        run: |
          cd ultimate-dev
          python scripts/sync-docs.py

      - name: Check for changes
        run: |
          cd ultimate-dev
          if ! git diff --quiet -- README.md; then
            echo "README.md is out of sync; run sync-docs.py locally" >&2
            git diff -- README.md
            exit 1
          fi

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test global install
        run: |
          cd ultimate-dev
          ./scripts/install.sh --global --yes

      - name: Verify installation
        run: |
          test -f "$HOME/.agents/skills/ultimate-dev/SKILL.md"
          test -f "$HOME/.agents/skills/ultimate-dev/VERSION"
          test -f "$HOME/.agents/skills/ultimate-dev/skill-manifest.yaml"

      - name: Test project install and reinstall
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root"
          cd "$test_root"
          git init -q
          cp -R "$GITHUB_WORKSPACE/ultimate-dev" .
          # The installer deliberately reads the repository-root VERSION source.
          cp "$GITHUB_WORKSPACE/VERSION" ./VERSION
          ./ultimate-dev/scripts/install.sh --project . --yes
          ./ultimate-dev/scripts/install.sh --project . --yes
          test -f .agents/skills/ultimate-dev/VERSION
          test -f .agents/skills/ultimate-dev/SKILL.md
          test -f .gitignore
          grep -Fqx '.memory/ultimate-dev/' .gitignore
          test ! -e .agents/skills/ultimate-dev/ultimate-dev

  pr-quality:
    name: PR Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Check PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf 'PR Title: %s\n' "$PR_TITLE"
          if printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?: .+'; then
            echo 'PR title follows conventional commits'
          else
            echo 'Warning: PR title should follow conventional commits: type(scope): description'
          fi

      - name: Check PR has description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ] || [ "$PR_BODY" = "null" ]; then
            echo 'Warning: PR description is empty; fill out the template'
          else
            echo 'PR has a description'
          fi

      - name: Check PR has labels
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if printf '%s' "$PR_LABELS" | jq -e 'length > 0' >/dev/null; then
            echo 'PR has labels'
          else
            echo 'Warning: PR has no labels'
          fi

      - name: Check for release label if targeting main
        if: github.event.pull_request.base.ref == 'main'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if printf '%s' "$PR_LABELS" | jq -e 'any(.[]; . == "release:patch" or . == "release:minor" or . == "release:major")' >/dev/null; then
            echo 'Release label found'
          else
            echo 'No release label; a merged PR will not auto-release'
          fi
