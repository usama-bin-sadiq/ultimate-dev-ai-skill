# Research Workflow
# For tasks that require investigation, analysis, or comparison before action.
# Uses Pattern D (Router) for parallel evidence gathering from multiple domains.

name: research
error_handling:
  on_step_failure: "retry_once_then_escalate"
  on_agent_failure: "fallback_to_generic_specialist"
  on_gate_failure: "block_and_report"
  max_retries: 2
description: >
  Structured research workflow using Router pattern:
  Question → Search (parallel) → Analyze → Synthesize → Recommend.

steps:
  - id: question
    name: "Define the Question (Orchestrator)"
    description: Break down the research objective into specific, answerable questions.
    agent: orchestrator
    actions:
      - Clarify the research goal
      - Identify constraints and success criteria
      - List specific questions to answer
      - Identify domains needed (backend, frontend, security, devops, etc.)
    outputs: [questions, constraints, domains]

  - id: search
    name: "Gather Evidence (Pattern D: Router)"
    description: >
      Classify questions by domain, dispatch to domain specialists in parallel,
      collect all evidence.
    agent: orchestrator
    condition: "{{ domains | length > 1 }}"
    actions:
      - For each domain: select specialist agent (tiebreaker)
      - Spawn all agents in parallel with their domain questions
      - Collect evidence from each specialist
      - Merge evidence by question
    outputs: [sources, evidence_by_domain]
    depends_on: [question]

  - id: search_single
    name: "Gather Evidence (Pattern A: Skills)"
    description: Single domain — use generic specialist or universal.
    agent: auto  # Resolved by orchestrator
    condition: "{{ domains | length == 1 }}"
    actions:
      - Load relevant skill methodology
      - Search authoritative sources
      - Note source credibility and dates
    outputs: [sources, evidence]
    depends_on: [question]

  - id: analyze
    name: "Analyze & Compare"
    description: Evaluate options against constraints and trade-offs.
    agent: system-architect
    actions:
      - Compare options against constraints
      - List pros/cons with evidence
      - Identify risks and unknowns
      - Apply precedence-rules.md for conflicts
    outputs: [analysis, options]
    depends_on: [search, search_single]

  - id: synthesize
    name: "Synthesize & Recommend"
    description: Produce a clear, evidence-based recommendation.
    agent: orchestrator
    actions:
      - Rank options by fit
      - Write recommendation with reasoning
      - Note open questions and risks
      - Format handoff report
    outputs: [recommendation, confidence, handoff_report]
    depends_on: [analyze]