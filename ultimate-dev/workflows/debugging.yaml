# Debugging Workflow
# For tasks that require finding and fixing bugs.

name: debugging
description: >
  Structured debugging workflow: reproduce → hypothesize → isolate → fix → verify.
  Systematic approach to finding and fixing bugs.

steps:
  - id: reproduce
    name: "Reproduce the Bug"
    description: >
      Before fixing anything, reproduce the problem reliably.
      If you can't reproduce it, you can't verify the fix.
    agent: orchestrator
    actions:
      - Get exact steps to reproduce
      - Identify environment and conditions
      - Confirm the bug is reproducible
    outputs: [repro_steps, environment]

  - id: hypothesize
    name: "Form Hypotheses"
    description: Generate possible causes based on symptoms and recent changes.
    agent: codebase-investigator
    actions:
      - Check recent changes (git log)
      - List possible causes
      - Prioritize by likelihood
      - Design verification for each hypothesis
    outputs: [hypotheses, verification_plan]

  - id: isolate
    name: "Isolate the Root Cause"
    description: Test hypotheses systematically to find the actual root cause.
    agent: debugging  # Uses debugging sub-skill methodology
    actions:
      - Add logging/print statements
      - Use debugger breakpoints
      - Check logs and traces
      - Verify assumptions with data
    outputs: [root_cause, evidence]
    depends_on: [hypothesize]

  - id: fix
    name: "Fix the Root Cause"
    description: Fix the root cause, not just the symptom.
    agent: auto  # Matched by domain
    actions:
      - Fix the root cause
      - Add a test that would have caught this
      - Check for related issues elsewhere
    outputs: [fix, test_added]
    depends_on: [isolate]

  - id: verify
    name: "Verify the Fix"
    description: Confirm the fix works and doesn't introduce regressions.
    agent: code-reviewer
    actions:
      - Run the reproduction steps (should be fixed)
      - Run full test suite
      - Check for regressions
    outputs: [verification_report]
    depends_on: [fix]
