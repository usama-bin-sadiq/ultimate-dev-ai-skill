# Implementation Workflow
# For tasks that require writing or modifying code.
# Uses Pattern C (Handoffs) by default for sequential implementation phases.

name: implementation
description: >
  Structured implementation workflow using Handoffs pattern:
  Spec → Plan → Implement → Test → Review.
  Orchestrator may compose with Subagents for parallel test writing.

steps:
  - id: spec
    name: "Clarify Specification"
    description: Ensure requirements are clear before writing any code.
    agent: orchestrator
    actions:
      - Confirm acceptance criteria
      - Identify edge cases
      - Check for existing patterns in codebase
      - Output: spec, edge_cases
    outputs: [spec, edge_cases]

  - id: plan
    name: "Plan Implementation"
    description: Design the approach, identify files to modify, assess blast radius.
    agent: system-architect
    actions:
      - Design the implementation approach
      - List files to create/modify
      - Enumerate blast radius (callers, tests, configs)
      - Estimate complexity
      - Output: plan, files, blast_radius
    outputs: [plan, files, blast_radius]
    depends_on: [spec]

  - id: implement
    name: "Implement (Pattern C: Handoffs)"
    description: >
      Write the code following existing patterns.
      If multi-domain: orchestrator spawns subagents in parallel (Pattern B compose).
    agent: orchestrator
    actions:
      - If single domain: load relevant module, spawn domain agent
      - If multi-domain: decompose, spawn subagents in parallel (Pattern B)
      - Execute implementation
      - Follow existing code style
      - Handle edge cases
      - Output: code, files_changed
    outputs: [code, files_changed]
    depends_on: [plan]

  - id: test
    name: "Test (Pattern B: Subagents)"
    description: >
      Write and run tests. Test writing parallelized via Subagents pattern.
    agent: orchestrator
    actions:
      - Decompose test needs by domain
      - Spawn test-automator / qa-engineer / performance-tester in parallel
      - Run existing test suite
      - Check edge cases
      - Verify no regressions
      - Output: test_results
    outputs: [test_results]
    depends_on: [implement]

  - id: review
    name: "Review"
    description: Final review before marking complete.
    agent: code-reviewer
    actions:
      - Code review
      - Security check (if risk > low)
      - Performance check (if hot path)
      - Format handoff
      - Output: review_report
    outputs: [review_report]
    depends_on: [test]