# Task Schema
# Defines the structure of a task object used for delegation and tracking.

task:
  type: object
  required:
    - task_id
    - objective
  properties:
    task_id:
      type: string
      format: "slugified-unique-identifier"
      description: "Unique identifier for this task"
      examples:
        - "fix-auth-null-session-001"
        - "implement-user-search-api-001"
        - "refactor-middleware-pipeline-001"

    title:
      type: string
      maxLength: 100
      description: "Short human-readable title for the task"

    objective:
      type: string
      description: "Clear, one-sentence statement of what needs to be accomplished"
      examples:
        - "Fix the null pointer exception in the auth middleware"
        - "Add a user search endpoint that supports filtering by name and email"
        - "Refactor the middleware pipeline to support async handlers"

    priority:
      type: string
      enum: ["critical", "high", "medium", "low"]
      default: "medium"
      description: "Task priority affecting scheduling and resource allocation"

    agent:
      type: string
      description: "Target agent role for this task"
      examples:
        - "backend-specialist"
        - "frontend-specialist"
        - "database-optimizer"
        - "security-reviewer"

    context:
      type: object
      properties:
        background:
          type: string
          description: "Relevant background information"
        related_files:
          type: array
          items:
            type: string
          description: "File paths relevant to this task"
        dependencies:
          type: array
          items:
            type: string
          description: "Blocking dependencies"
        existing_patterns:
          type: string
          description: "Codebase conventions to follow"
        parent_task:
          type: string
          description: "Parent task ID if this is a sub-task"

    constraints:
      type: object
      properties:
        scope:
          type: string
          description: "Explicit boundaries: what is IN and OUT of scope"
        technical:
          type: array
          items:
            type: string
          description: "Technical constraints"
        style:
          type: array
          items:
            type: string
          description: "Style and convention constraints"
        time:
          type: string
          description: "Time limit or deadline"

    acceptance_criteria:
      type: array
      items:
        type: object
        properties:
          criterion:
            type: string
            description: "Specific, testable criterion"
          verified:
            type: boolean
            default: false
            description: "Whether this criterion has been verified"
      description: "List of criteria that must be met for the task to be considered done"

    verification_steps:
      type: array
      items:
        type: string
      description: "Steps to verify the task is complete"

    dependencies:
      type: array
      items:
        type: object
        properties:
          task_id:
            type: string
            description: "ID of the dependency task"
          relationship:
            type: string
            enum: ["blocks", "blocked_by", "related_to"]
            description: "Nature of the dependency"
      description: "Tasks that this task depends on or is related to"

    metadata:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: "Agent or user who created this task"
        tags:
          type: array
          items:
            type: string
          description: "Categorization tags"
        estimated_complexity:
          type: string
          enum: ["trivial", "simple", "moderate", "complex", "epic"]
          description: "Estimated task complexity"

# Example task
example:
  task_id: "fix-auth-null-session-001"
  title: "Fix auth middleware null session crash"
  objective: "Fix null pointer exception when user session is missing in auth middleware"
  priority: "high"
  agent: "backend-specialist"
  context:
    background: >
      Users are reporting 500 errors when their JWT expires and they try to
      access protected routes. The auth middleware crashes instead of returning 401.
    related_files:
      - "src/auth/middleware.ts"
      - "src/types/auth.ts"
      - "src/auth/__tests__/middleware.test.ts"
    existing_patterns: >
      Other middleware in src/middleware/ follow the pattern of checking
      for null before accessing nested properties.
  constraints:
    scope: "Only modify auth middleware and its tests. Do not change route definitions."
    technical:
      - "Return 401 for missing/expired sessions (not 503)"
      - "Log failed auth attempts for security monitoring"
    style:
      - "Follow existing error handling patterns in the codebase"
  acceptance_criteria:
    - criterion: "Null session returns 401 with 'Session expired' message"
    - criterion: "Valid session passes through without modification"
    - criterion: "All existing auth tests continue to pass"
    - criterion: "New tests cover null session, expired session, and valid session"
  verification_steps:
    - "Run npm test -- --grep auth"
    - "Verify TypeScript compilation with npx tsc --noEmit"
    - "Manual test with curl against running server"
