# Result Schema
# Defines the structure of a result object returned after task execution.

result:
  type: object
  required:
    - task_id
    - status
    - summary
  properties:
    task_id:
      type: string
      description: "ID of the task this result corresponds to"

    agent:
      type: string
      description: "Agent role that produced this result"

    status:
      type: string
      enum: ["completed", "partial", "failed", "blocked", "not_run"]
      description: "Overall status of the task execution"
      semantics:
        completed: "All acceptance criteria met, no blockers remaining"
        partial: "Some work done but gaps or blockers remain"
        failed: "Could not complete the task; includes what was attempted"
        blocked: "A required decision, capability, or approval prevented safe progress"
        not_run: "The task or a required verification was not executed"

    summary:
      type: string
      maxLength: 200
      description: "One-line summary of what was accomplished"

    output:
      type: object
      properties:
        what_changed:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
                description: "Path to the file"
              action:
                type: string
                enum: ["created", "modified", "deleted", "renamed"]
                description: "What was done to the file"
              description:
                type: string
                description: "Description of the change"
          description: "List of files changed and what was done to each"
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: ["test_output", "compilation", "lint", "verification", "manual"]
              content:
                type: string
                description: "Evidence content (output, log, etc.)"
          description: "Verifiable evidence that the work was done correctly"
        artifacts:
          type: array
          items:
            type: string
          description: "New files or artifacts created (beyond code changes)"

    assumptions:
      type: array
      items:
        type: string
      description: "Assumptions made during execution that may need validation"

    open_questions:
      type: array
      items:
        type: string
      description: "Questions that remain unanswered or need follow-up"

    residual_risks:
      type: array
      items:
        type: object
        properties:
          risk:
            type: string
            description: "Description of the risk"
          mitigation:
            type: string
            description: "Suggested mitigation"
          severity:
            type: string
            enum: ["critical", "high", "medium", "low"]
      description: "Known risks that remain after the task is completed"

    next_steps:
      type: array
      items:
        type: string
      description: "Recommended follow-up actions"

    metadata:
      type: object
      properties:
        duration:
          type: string
          description: "Time taken to complete the task"
        tools_used:
          type: array
          items:
            type: string
          description: "Tools and commands used during execution"
        files_read:
          type: integer
          description: "Number of files read for context"
        tests_run:
          type: integer
          description: "Number of tests executed"
        retry_count:
          type: integer
          default: 0
          description: "Number of retries before success or failure"

# Example result
example:
  task_id: "fix-auth-null-session-001"
  agent: "backend-specialist"
  status: "completed"
  summary: "Fixed null pointer in auth middleware by adding null session checks and updating types"
  output:
    what_changed:
      - file: "src/auth/middleware.ts"
        action: "modified"
        description: "Added null check for req.session before accessing user properties"
      - file: "src/types/auth.ts"
        action: "modified"
        description: "Changed AuthContext.user from required to optional"
      - file: "src/auth/__tests__/middleware.test.ts"
        action: "created"
        description: "Added 3 test cases for null session handling"
    evidence:
      - type: "test_output"
        content: |
          PASS src/auth/__tests__/middleware.test.ts
            ✓ handles null session (2ms)
            ✓ validates session expiry (1ms)
            ✓ rejects expired tokens (1ms)
          Tests: 3 passed, 3 total
      - type: "compilation"
        content: "TypeScript: 0 errors. ESLint: 0 warnings."
  assumptions:
    - "Returning 401 for null sessions matches existing auth patterns"
  open_questions:
    - "Should expired sessions be cleaned up by a background job?"
  residual_risks:
    - risk: "Session table may grow large without cleanup"
      mitigation: "Add cron job to delete sessions older than 30 days"
      severity: "low"
  next_steps:
    - "Add session cleanup cron job"
    - "Add monitoring for null session rate"
  metadata:
    duration: "8 minutes"
    tools_used: ["read_file", "write_file", "run_shell_command"]
    files_read: 6
    tests_run: 3
    retry_count: 0
