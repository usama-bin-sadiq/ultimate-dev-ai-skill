# Error Schema
# Defines the structure of error objects for consistent error handling and reporting.

error:
  type: object
  required:
    - error_code
    - message
    - severity
  properties:
    error_code:
      type: string
      pattern: "^[A-Z]+_[A-Z_]+$"
      description: "Machine-readable error code in SCREAMING_SNAKE_CASE"
      examples:
        - "AUTH_NULL_SESSION"
        - "DB_CONNECTION_FAILED"
        - "VALIDATION_MISSING_FIELD"
        - "PERMISSION_DENIED"
        - "TIMEOUT_EXCEEDED"

    message:
      type: string
      description: "Human-readable error message"
      examples:
        - "User session is null or expired"
        - "Database connection failed after 3 retries"
        - "Required field 'email' is missing"

    severity:
      type: string
      enum: ["critical", "high", "medium", "low", "info"]
      description: "Error severity level"
      semantics:
        critical: >
          System is down or data is at risk. Immediate action required.
          Examples: data corruption, security breach, complete outage.
        high: >
          Major functionality is broken. Urgent fix needed.
          Examples: feature not working, authentication failure, API errors.
        medium: >
          Functionality is degraded but workaround exists.
          Examples: slow performance, partial feature failure, non-critical errors.
        low: >
          Minor issue with minimal impact.
          Examples: cosmetic bugs, deprecated warnings, minor inconveniences.
        info: >
          Informational message, not an error.
          Examples: deprecation notices, configuration suggestions.

    category:
      type: string
      enum:
        - "auth"
        - "validation"
        - "database"
        - "network"
        - "permission"
        - "configuration"
        - "dependency"
        - "logic"
        - "resource"
        - "unknown"
      description: "Error category for routing and filtering"

    context:
      type: object
      properties:
        component:
          type: string
          description: "Which component or module produced the error"
        operation:
          type: string
          description: "What operation was being performed"
        input:
          type: object
          description: "The input that triggered the error (sanitized)"
        environment:
          type: string
          description: "Where the error occurred (dev, staging, production)"
        timestamp:
          type: string
          format: date-time
          description: "When the error occurred"
        stack_trace:
          type: string
          description: "Stack trace if available"
        request_id:
          type: string
          description: "Correlation ID for tracing"
      description: "Additional context about the error"

    suggested_fix:
      type: string
      description: "Suggested action to resolve the error"

    retry_info:
      type: object
      properties:
        retryable:
          type: boolean
          default: false
          description: "Whether this error can be retried"
        max_retries:
          type: integer
          description: "Maximum number of retries allowed"
        retry_after:
          type: integer
          description: "Seconds to wait before retrying"
        attempt:
          type: integer
          description: "Current attempt number"
      description: "Retry policy information (if applicable)"

    related_errors:
      type: array
      items:
        type: string
      description: "IDs or codes of related errors for grouping"

# Error code convention
error_code_convention: |
  Error codes follow the pattern: CATEGORY_SPECIFIC_DESCRIPTION

  Categories:
  - AUTH_: Authentication and session errors
  - VALID_: Input validation errors
  - DB_: Database errors
  - NET_: Network and connectivity errors
  - PERM_: Permission and authorization errors
  - CONFIG_: Configuration errors
  - DEP_: Dependency errors
  - LOGIC_: Business logic errors
  - RES_: Resource errors (memory, disk, CPU)
  - TIMEOUT_: Timeout errors

  Examples:
  - AUTH_NULL_SESSION
  - AUTH_TOKEN_EXPIRED
  - AUTH_INVALID_CREDENTIALS
  - VALID_MISSING_FIELD
  - VALID_INVALID_FORMAT
  - DB_CONNECTION_FAILED
  - DB_QUERY_TIMEOUT
  - DB_CONSTRAINT_VIOLATION
  - NET_CONNECTION_REFUSED
  - NET_DNS_RESOLUTION_FAILED
  - PERM_DENIED
  - PERM_INSUFFICIENT_SCOPE

# Example errors
examples:
  auth_error:
    error_code: "AUTH_NULL_SESSION"
    message: "User session is null or expired"
    severity: "high"
    category: "auth"
    context:
      component: "auth/middleware"
      operation: "session_validation"
      input:
        path: "/api/users/profile"
        method: "GET"
      environment: "production"
      timestamp: "2026-09-22T10:30:00Z"
      request_id: "req-abc-123"
    suggested_fix: "Clear expired session and redirect to login"
    retry_info:
      retryable: false

  validation_error:
    error_code: "VALID_MISSING_FIELD"
    message: "Required field 'email' is missing from request body"
    severity: "medium"
    category: "validation"
    context:
      component: "api/users"
      operation: "create_user"
      input:
        name: "John Doe"
        # email is missing
    suggested_fix: "Include 'email' field in request body"
    retry_info:
      retryable: false

  database_error:
    error_code: "DB_QUERY_TIMEOUT"
    message: "Database query exceeded timeout of 30 seconds"
    severity: "high"
    category: "database"
    context:
      component: "database/query"
      operation: "find_users_by_criteria"
      environment: "production"
    suggested_fix: "Add index to queried columns or optimize query"
    retry_info:
      retryable: true
      max_retries: 2
      retry_after: 5
      attempt: 1

  network_error:
    error_code: "NET_CONNECTION_REFUSED"
    message: "Connection to external API refused"
    severity: "medium"
    category: "network"
    context:
      component: "external/payment_api"
      operation: "process_payment"
    suggested_fix: "Check API endpoint availability and network connectivity"
    retry_info:
      retryable: true
      max_retries: 3
      retry_after: 10
      attempt: 1
