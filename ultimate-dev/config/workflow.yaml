# Workflow Configuration — Defines execution flows for common task types

version: "2.6.0"

workflows:
  # ─── Default: Simple, sequential task execution ───
  default:
    description: "Standard linear workflow for simple tasks"
    steps:
      - phase: analyze
        agent: planner
        description: "Understand the task and plan execution"
        timeout: 60s
        outputs: [plan, context]

      - phase: implement
        agent: auto  # Determined by task type
        description: "Execute the planned work"
        timeout: 300s
        depends_on: [analyze]
        outputs: [result, files_changed]

      - phase: verify
        agent: reviewer
        description: "Verify the implementation meets requirements"
        timeout: 120s
        depends_on: [implement]
        outputs: [verification_report]
        on_failure: retry_once

  # ─── Research: Deep investigation workflow ───
  research:
    description: "Multi-source research with synthesis"
    steps:
      - phase: scope
        agent: planner
        description: "Define research questions and scope"
        timeout: 60s
        outputs: [questions, search_plan]

      - phase: gather
        agent: auto
        parallel: true
        description: "Gather information from multiple sources"
        timeout: 180s
        depends_on: [scope]
        outputs: [raw_data]

      - phase: synthesize
        agent: planner
        description: "Synthesize findings into actionable insights"
        timeout: 120s
        depends_on: [gather]
        outputs: [synthesis, recommendations]

  # ─── Implementation: Full feature development ───
  implementation:
    description: "End-to-end feature implementation with quality gates"
    steps:
      - phase: plan
        agent: planner
        description: "Break down the feature into implementable units"
        timeout: 120s
        outputs: [task_breakdown, dependencies, estimates]

      - phase: design
        agent: architect
        description: "Design the solution architecture"
        timeout: 180s
        depends_on: [plan]
        outputs: [design, adr, interface_specs]

      - phase: implement-backend
        agent: backend
        parallel_with: [implement-frontend]
        description: "Implement backend components"
        timeout: 600s
        depends_on: [design]
        outputs: [backend_code, api_specs]

      - phase: implement-frontend
        agent: frontend
        parallel_with: [implement-backend]
        description: "Implement frontend components"
        timeout: 600s
        depends_on: [design]
        outputs: [frontend_code, component_specs]

      - phase: test
        agent: tester
        description: "Write and run tests"
        timeout: 300s
        depends_on: [implement-backend, implement-frontend]
        outputs: [test_results, coverage_report]
        on_failure: block_remaining

      - phase: review
        agent: reviewer
        description: "Code review and quality check"
        timeout: 180s
        depends_on: [test]
        outputs: [review_report]
        on_failure: send_back_to_implement

      - phase: document
        agent: writer
        description: "Update documentation and changelog"
        timeout: 120s
        depends_on: [review]
        outputs: [docs_updated]

  # ─── Review: Code quality and security review ───
  review:
    description: "Thorough code review with security analysis"
    steps:
      - phase: static-analysis
        agent: reviewer
        description: "Static analysis and linting"
        timeout: 120s
        outputs: [lint_results, style_issues]

      - phase: security-scan
        agent: security
        parallel_with: [deep-review]
        description: "Security vulnerability analysis"
        timeout: 180s
        outputs: [security_report]

      - phase: deep-review
        agent: reviewer
        parallel_with: [security-scan]
        description: "Deep code review for logic and architecture"
        timeout: 180s
        outputs: [code_review]

      - phase: summarize
        agent: reviewer
        description: "Consolidate findings into actionable report"
        timeout: 60s
        depends_on: [static-analysis, security-scan, deep-review]
        outputs: [final_report]

  # ─── Debugging: Systematic bug investigation and fix ───
  debugging:
    description: "Systematic root cause analysis and fix"
    steps:
      - phase: reproduce
        agent: debugger
        description: "Reproduce the issue and gather evidence"
        timeout: 120s
        outputs: [reproduction_steps, error_logs]

      - phase: analyze
        agent: debugger
        description: "Root cause analysis"
        timeout: 180s
        depends_on: [reproduce]
        outputs: [root_cause, affected_components]

      - phase: fix
        agent: debugger
        description: "Implement the fix"
        timeout: 300s
        depends_on: [analyze]
        outputs: [fix_applied, files_changed]

      - phase: verify-fix
        agent: tester
        description: "Verify the fix and check for regressions"
        timeout: 180s
        depends_on: [fix]
        outputs: [verification_report, regression_check]

  # ─── Emergency: Critical issue response ───
  emergency:
    description: "Rapid response for critical/production issues"
    steps:
      - phase: triage
        agent: debugger
        description: "Quick triage and severity assessment"
        timeout: 30s
        outputs: [severity, impact_assessment]

      - phase: mitigate
        agent: debugger
        description: "Apply immediate mitigation (rollback/hotfix)"
        timeout: 120s
        depends_on: [triage]
        outputs: [mitigation_applied]

      - phase: root-cause
        agent: debugger
        description: "Find root cause (can continue post-mitigation)"
        timeout: 300s
        depends_on: [mitigate]
        outputs: [root_cause_analysis]

      - phase: permanent-fix
        agent: backend
        description: "Implement permanent fix"
        timeout: 600s
        depends_on: [root-cause]
        outputs: [permanent_fix]

      - phase: postmortem
        agent: writer
        description: "Write incident report and postmortem"
        timeout: 180s
        depends_on: [permanent-fix]
        outputs: [postmortem_report]

# Global settings
global:
  max_parallel_agents: 5
  default_timeout: 300s
  max_retries: 2
  retry_backoff: exponential
  failure_strategy: report_and_continue
  context_sharing: selective  # agents only receive relevant context
  artifact_retention: 30d
