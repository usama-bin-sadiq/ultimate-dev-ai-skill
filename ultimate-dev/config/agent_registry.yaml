routing_rules:
  - match:
      intent: "web-automation"
      description: "Browser automation, scraping, navigation, screenshots"
    delegate_to: ["browser-agent"]

  - match:
      intent: "web-search"
      description: "Search the web for information"
    delegate_to: ["browser-agent"]

  - match:
      intent: "implement-feature"
      complexity: "high"
    delegate_to: ["planner", "architect", "backend", "frontend", "tester"]

  - match:
      intent: "implement-feature"
      complexity: "low"
    delegate_to: ["backend"]

  - match:
      intent: "fix-bug"
    delegate_to: ["debugger"]

  - match:
      intent: "review-code"
    delegate_to: ["reviewer"]

  - match:
      intent: "run-tests"
    delegate_to: ["tester"]

  - match:
      intent: "security-audit"
    delegate_to: ["security"]

  - match:
      intent: "deploy"
    delegate_to: ["devops"]

  - match:
      intent: "write-documentation"
    delegate_to: ["writer"]
