version: "3.1.0"
description: >-
  Compact prompt-first routing index. Load this before selecting a specialist;
  it intentionally contains signals and entrypoints, not full methodology.
status_legend:
  strong: Existing coverage is broad and directly routable.
  partial: Existing coverage exists but important common workflows are missing.
  missing: No reliable first-class capability exists yet.
routing_policy:
  common_first: true
  skills_before_agents: true
  max_primary_agents_per_domain: 1
  broad_triggers_are_hints: true
  require_intent_and_context_for_ambiguous_routes: true
  deliverable_first: true
  unknown_capability: disclose_and_fallback
  unknown_fallback_skill: universal-task
  capability_gap_report: required
  prompt_only_supported: true
  do_not_load_full_registry_for_every_task: true

# Deliverables are selected before departments. A task may have more than one
# material domain, but its requested output still needs a primary type.
deliverable_types:
  - id: answer
    signals: [explain, answer, describe, clarify]
    primary_skills: [research, documentation]
    output_contract: concise explanation with assumptions
  - id: research
    signals: [research, investigate, evidence, literature, sources]
    primary_skills: [research]
    output_contract: sourced synthesis with evidence and limitations
  - id: comparison
    signals: [compare, versus, alternatives, trade-off]
    primary_skills: [business-analysis, research]
    output_contract: criteria, comparison, recommendation boundary
  - id: recommendation
    signals: [recommend, choose, best option, advise]
    primary_skills: [business-analysis, research]
    output_contract: options, rationale, uncertainty, next action
  - id: plan
    signals: [plan, roadmap, sequence, milestones]
    primary_skills: [planning-execution]
    output_contract: dependencies, checkpoints, owners, verification
  - id: requirements
    signals: [requirements, PRD, user story, acceptance criteria]
    primary_skills: [discovery-requirements]
    output_contract: scope, acceptance criteria, open decisions
  - id: specification
    signals: [specification, spec, design brief, schema]
    primary_skills: [architecture, documentation]
    output_contract: structure, constraints, interfaces, verification
  - id: decision
    signals: [architecture decision, ADR, choose a design]
    primary_skills: [architecture]
    output_contract: decision, alternatives, consequences, evidence
  - id: code
    signals: [implement, build, code, add feature, refactor]
    primary_skills: [coding]
    output_contract: change, files, tests, limitations
  - id: bug-fix
    signals: [bug, failure, crash, regression, fix]
    primary_skills: [debugging, coding]
    output_contract: reproduction, fix, regression check, residual risk
  - id: review
    signals: [review, critique, inspect, assess]
    primary_skills: [review]
    output_contract: findings, severity, evidence, recommendation
  - id: security-review
    signals: [threat model, vulnerability, security review]
    primary_skills: [security]
    output_contract: threat/risk findings and human-review boundary
  - id: audit
    signals: [audit, control test, evidence request, finding]
    primary_skills: [audit-controls]
    output_contract: scope, evidence, finding, owner, due date
  - id: financial-analysis
    signals: [budget, forecast, valuation, unit economics, variance]
    primary_skills: [accounting-finance, data-analysis-bi]
    output_contract: assumptions, period, currency, sources, scenarios
  - id: data-analysis
    signals: [dataset, metric, SQL, dashboard, experiment]
    primary_skills: [data-analysis-bi, data]
    output_contract: definitions, lineage, method, uncertainty
  - id: document
    signals: [report, document, memo, policy, guide]
    primary_skills: [documentation, office-artifacts]
    output_contract: audience, structure, provenance, review status
  - id: spreadsheet
    signals: [spreadsheet, workbook, XLSX, model]
    primary_skills: [office-artifacts, data-analysis-bi]
    output_contract: data provenance, formulas, validation, assumptions
  - id: presentation
    signals: [presentation, slides, deck, PPTX]
    primary_skills: [office-artifacts]
    output_contract: narrative, source notes, audience, artifact status
  - id: communication
    signals: [email, announcement, status update, meeting notes]
    primary_skills: [internal-communications]
    output_contract: audience, message, owner, next action, approval
  - id: workflow
    signals: [automate, workflow, integration, schedule]
    primary_skills: [planning-execution, api-design]
    output_contract: trigger, inputs, outputs, retries, approval, monitoring
  - id: creative
    signals: [creative, concept, story, visual direction]
    primary_skills: [research, documentation]
    output_contract: concept, rationale, constraints, review criteria
  - id: learning
    signals: [teach, explain a new topic, study]
    primary_skills: [research, documentation]
    output_contract: explanation, examples, practice path, sources
  - id: unknown
    signals: [unclear, unfamiliar, no matching capability, novel domain]
    primary_skills: [universal-task, research, planning-execution]
    output_contract: bounded result, unknowns, confidence, capability gap
domains:
  - id: software-engineering
    status: strong
    signals: [code, repository, feature, bug, refactor, test, API, service, frontend, backend, database, infrastructure]
    skills: [project-context, coding, architecture, testing, debugging, api-design, devops, security, migration]
    agents: [orchestrator, universal-technology-specialist, codebase-investigator]
    fallback: universal-technology-specialist
    risk: none
    notes: Primary product strength; use the smallest applicable skill first.
  - id: product-discovery
    status: partial
    signals: [requirements, discovery, PRD, user research, acceptance criteria, roadmap, prioritization, stakeholder]
    skills: [discovery-requirements, planning-execution, research, architecture, documentation]
    agents: [product-owner, ux-researcher]
    fallback: universal-technology-specialist
    risk: none
    notes: Add a dedicated requirements/discovery skill before claiming complete coverage.
  - id: program-project-operations
    status: partial
    signals: [program, project plan, backlog, sprint, dependency, risk register, change request, status, resource plan]
    skills: [planning-execution, documentation, architecture]
    agents: [product-owner, scrum-master, release-manager]
    fallback: orchestrator
    risk: data
    notes: Add RAID logs, change control, capacity, and governance templates.
  - id: internal-communications
    status: partial
    signals: [status update, meeting notes, decision memo, executive summary, stakeholder, incident update, internal announcement]
    skills: [internal-communications, documentation]
    agents: [tech-writer, devrel-engineer]
    fallback: generalist
    risk: data
    notes: Communication method is available; company-specific channels and approval policies remain host concerns.
  - id: strategy-operating-model
    status: strong
    signals: [strategy, operating model, business model, OKR, KPI tree, process map, value chain, decision memo]
    skills: [strategy-operating-model, business-analysis, research, documentation]
    agents: []
    fallback: universal-technology-specialist
    risk: data
    notes: Dedicated strategy operating-model skill is available; company-specific governance references remain optional.
  - id: research-analysis
    status: partial
    signals: [research, compare, investigate, literature, market, competitor, evidence, citation, synthesis]
    skills: [research, data, documentation]
    agents: [research-methodologist, codebase-investigator, generalist]
    fallback: generalist
    risk: none
    notes: Strong method coverage; add claim/source ledger and domain research templates.
  - id: data-bi
    status: strong
    signals: [dataset, analytics, KPI, dashboard, metric, SQL, warehouse, experiment, visualization, forecast]
    skills: [data-analysis-bi, data, performance, documentation]
    agents: [data-engineer, data-pipeline-engineer, sql-optimizer, financial-analyst]
    fallback: generalist
    risk: data
    notes: Add reproducible analysis, metric definitions, lineage, and uncertainty guidance.
  - id: finance-fpa
    status: partial
    signals: [budget, forecast, P&L, cash flow, runway, margin, unit economics, variance, board plan]
    skills: [data, research, documentation]
    agents: [financial-analyst, fintech-analyst, revenue-operations]
    fallback: financial-analyst
    risk: compliance
    notes: Never invent financial values; identify assumptions, period, currency, and source.
  - id: accounting-controls
    status: partial
    signals: [accounting, ledger, reconciliation, close, accrual, tax, management accounts, control, audit evidence]
    skills: [accounting-finance, audit-controls, data, review]
    agents: [compliance-officer]
    fallback: generalist
    risk: compliance
    notes: Requires human finance/accounting review and jurisdiction-specific references.
  - id: legal-privacy-contracts
    status: strong
    signals: [contract, clause, legal hold, privacy, DPA, retention, policy, regulatory, consent, records]
    skills: [legal-privacy, security, documentation, research]
    agents: [legal-tech, compliance-engineer, health-informaticist]
    fallback: generalist
    risk: compliance
    notes: Produce issue lists and questions; do not provide privileged legal advice.
  - id: audit-risk-assurance
    status: partial
    signals: [audit, control test, evidence request, finding, risk register, assurance, issue closure, compliance review]
    skills: [audit-controls, security, review, research]
    agents: [security-auditor, compliance-engineer, threat-modeler]
    fallback: security-auditor
    risk: compliance
    notes: Control-testing method is available; jurisdiction-specific audit references remain required.
  - id: people-operations
    status: partial
    signals: [hiring, recruiting, onboarding, workforce, performance, compensation, employee relations, offboarding]
    skills: [people-operations]
    agents: []
    fallback: generalist
    risk: compliance
    notes: Add privacy-safe people operations methods with explicit escalation boundaries.
  - id: procurement-vendors
    status: partial
    signals: [procurement, vendor, supplier, RFP, RFQ, purchase order, due diligence, renewal, offboarding]
    skills: [procurement-vendors]
    agents: []
    fallback: generalist
    risk: compliance
    notes: Add intake, approval, due-diligence, and contract-handoff workflows.
  - id: operations-assets-facilities
    status: missing
    signals: [asset register, facilities, inventory, maintenance, access request, vendor, office operations]
    skills: []
    agents: []
    fallback: generalist
    risk: data
    notes: Add asset lifecycle and facilities reference packs after core company workflows.
  - id: marketing-sales-support
    status: strong
    signals: [marketing, campaign, SEO, content, sales, pipeline, CRM, proposal, support, ticket, customer success]
    skills: [documentation, research, data]
    agents: [content-strategist, growth-hacker, sales-engineer, account-manager, support-ops, customer-success]
    fallback: generalist
    risk: data
    notes: Broad existing coverage; keep claims, consent, and outreach boundaries explicit.
  - id: office-knowledge-artifacts
    status: partial
    signals: [DOCX, PDF, XLSX, PPTX, spreadsheet, slide deck, report, meeting notes, knowledge base]
    skills: [office-artifacts, documentation, data]
    agents: [tech-writer, devrel-engineer]
    fallback: generalist
    risk: data
    notes: Artifact method is available; format-specific helpers and company templates remain optional.
  - id: automation-integrations
    status: partial
    signals: [automation, workflow, webhook, schedule, API, MCP, integration, retry, idempotency, monitoring]
    skills: [api-design, devops, monitoring]
    agents: [pipeline-engineer, generalist]
    fallback: pipeline-engineer
    risk: security
    notes: Runtime automation is optional; prompt method must define contracts and human approval.
  - id: prompt-skill-quality
    status: partial
    signals: [evaluate a skill, routing regression, prompt test, golden cases, false activation, context cost, agent benchmark]
    skills: [prompt-evaluation, testing, review, research]
    agents: [quality-engineer, skill-maintainer, task-observer]
    fallback: generalist
    risk: none
    notes: Fixture-driven prompt and routing evaluation is available; behavioral benchmarks remain pending.
  - id: specialized-industries
    status: strong
    signals: [healthcare, game development, GIS, spatial, blockchain, IoT, supply chain, legal tech, quantum]
    skills: [research, data, security]
    agents: [health-informaticist, game-programmer, spatial-analyst, smart-contract-developer, iot-engineer, supply-chain, legal-tech, quantum-computing]
    fallback: universal-technology-specialist
    risk: compliance
    notes: Specialized coverage is strong but should not be confused with general department readiness.
  - id: unknown-unclassified
    status: strong
    signals: [unknown task, unclassified task, unfamiliar domain, novel capability, no matching skill, capability gap]
    skills: [universal-task, research, planning-execution]
    agents: []
    fallback: universal-technology-specialist
    fallback_skill: universal-task
    risk: data
    notes: Use universal-task first; use the fallback agent only when an actual bounded execution role is needed and available. Complete only a safe portion and disclose the capability gap.
