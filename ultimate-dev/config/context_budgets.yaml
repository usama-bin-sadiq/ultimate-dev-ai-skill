# Context Budget Configuration — Controls how context is allocated and managed

version: "3.1.0"

# Per-task context budgets
task_budgets:
  simple:
    description: "Simple tasks — single file edits, small changes"
    max_context_tokens: 8000
    max_files: 5
    max_file_size_kb: 50
    include:
      - task_description
      - target_file
      - immediate_dependencies
    exclude:
      - other_agent_outputs
      - full_project_structure

  moderate:
    description: "Moderate tasks — multi-file changes, feature additions"
    max_context_tokens: 16000
    max_files: 15
    max_file_size_kb: 100
    include:
      - task_description
      - target_files
      - related_tests
      - api_contracts
      - type_definitions
    exclude:
      - unrelated_modules

  complex:
    description: "Complex tasks — architecture changes, new features"
    max_context_tokens: 32000
    max_files: 30
    max_file_size_kb: 200
    include:
      - task_description
      - all_related_files
      - architecture_docs
      - existing_patterns
      - dependency_tree

  emergency:
    description: "Emergency tasks — critical fixes, production issues"
    max_context_tokens: 12000
    max_files: 10
    max_file_size_kb: 50
    include:
      - error_logs
      - affected_files
      - recent_changes
    notes: "Minimize context to maximize speed"

# Context priority levels (higher = more important, kept in context first)
priority_levels:
  critical:
    - task_description
    - error_messages
    - affected_source_files

  high:
    - type_definitions
    - api_interfaces
    - test_files_for_affected_code

  medium:
    - documentation
    - configuration_files
    - related_module_files

  low:
    - other_agent_outputs
    - full_project_structure
    - historical_context

# Context sharing between agents
sharing:
  between_agents:
    enabled: true
    max_shared_tokens: 8000
    strategy: selective  # only share relevant portions
    format: structured  # JSON-like structured sharing

  to_user:
    enabled: true
    max_summary_tokens: 1000
    include_progress: true
    include_decisions: true
    include_blockers: true

# File inclusion rules
file_rules:
  always_include:
    - "README.md"
    - "package.json"
    - "tsconfig.json"
    - "pyproject.toml"
    - "Cargo.toml"
    - "go.mod"

  include_if_relevant:
    - "*.config.*"
    - ".env.example"
    - "Dockerfile"
    - "docker-compose*.yml"
    - ".github/workflows/*.yml"

  never_include:
    - "node_modules/**"
    - ".git/**"
    - "dist/**"
    - "build/**"
    - "*.min.js"
    - "*.min.css"
    - "*.map"
    - "*.lock"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
