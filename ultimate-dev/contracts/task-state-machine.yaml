version: "1.0"
kind: ultimate-dev-task-state-machine
status: portable
runtime_required: false

initial: intake
terminal_states: [completed, partial, failed, blocked, not_run]

states:
  intake: "Capture intent, constraints, acceptance criteria, and unknowns."
  discovered: "Load only relevant project instructions and context."
  classified: "Select deliverable, size, domains, risk, clarity, and capability gap."
  planned: "Define the smallest safe pattern, evidence plan, and checkpoints."
  executing: "Use only requested, available, policy-allowed capabilities."
  verifying: "Run declared checks and collect evidence."
  synthesizing: "Assemble the result, limitations, and next actions."
  completed: "Acceptance criteria and required evidence are satisfied."
  partial: "A safe bounded result exists, but a named gap remains."
  blocked: "Safe completion requires clarification, permission, data, or human review."
  failed: "A declared execution or verification step failed."
  not_run: "A required check or action was not executed."

transitions:
  - {from: intake, to: discovered, requires: [intent_captured]}
  - {from: discovered, to: classified, requires: [context_discovered_or_gap_reported]}
  - {from: classified, to: planned, requires: [clarity_not_blocked]}
  - {from: classified, to: blocked, requires: [clarity_blocked]}
  - {from: planned, to: executing, requires: [capability_intersection, approval_if_required]}
  - {from: planned, to: blocked, requires: [capability_gap_blocking]}
  - {from: executing, to: verifying, requires: [action_result_recorded]}
  - {from: verifying, to: synthesizing, requires: [evidence_recorded]}
  - {from: verifying, to: failed, requires: [verification_failed]}
  - {from: synthesizing, to: completed, requires: [acceptance_criteria_satisfied, evidence_present]}
  - {from: synthesizing, to: partial, requires: [bounded_result, capability_gap_reported]}
  - {from: any, to: not_run, requires: [required_check_not_executed]}

invariants:
  - "A terminal success state requires evidence; confidence is not evidence."
  - "A blocked or failed state must not be reported as completed."
  - "A side effect cannot execute without capability intersection and required approval."
  - "Every resume includes state, next_action, evidence_refs, and unresolved items."
  - "not_run is preserved as a first-class result."
