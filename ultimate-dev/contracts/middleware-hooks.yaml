version: "1.0"
kind: ultimate-dev-middleware-hooks
status: portable
runtime_required: false

principle: "Hooks are selective, ordered, host-neutral controls. They observe or constrain; they never grant authority."

hook_order:
  - before_intake
  - before_route
  - before_action
  - around_tool
  - before_model
  - after_model
  - after_action
  - before_checkpoint
  - on_completion

hooks:
  before_intake:
    purpose: "Normalize input, bound size, and mark sensitive content."
    required_outputs: [normalized_input, sensitivity, unknowns]
  before_route:
    purpose: "Validate deliverable, size, domain, risk, clarity, and gap."
    required_outputs: [decision_record, validation_errors]
  before_action:
    purpose: "Enforce capability intersection, approval, and side-effect policy."
    required_outputs: [allowed_capabilities, blocked_capabilities, approval_state]
  around_tool:
    purpose: "Apply timeout, bounded retry, backoff, rate limit, and idempotency."
    required_outputs: [attempt, duration, retry_reason, effect_class]
  before_model:
    purpose: "Project only relevant context and state available capabilities."
    required_outputs: [context_budget, selected_context, capability_limits]
  after_model:
    purpose: "Validate structure, redaction, and guardrail expectations."
    required_outputs: [schema_status, redaction_status, next_action]
  after_action:
    purpose: "Validate results, capture evidence, and classify failure."
    required_outputs: [result_status, evidence_refs, side_effect_record]
  before_checkpoint:
    purpose: "Persist the smallest resumable state with provenance."
    required_outputs: [state, next_action, evidence_refs, unresolved]
  on_completion:
    purpose: "Check acceptance criteria, retention, cleanup, and safe closure."
    required_outputs: [completion_status, evidence_summary, cleanup_status]

rules:
  - "Apply only hooks justified by risk, side effect, and host capability."
  - "A hook may recommend a control but cannot authorize an action."
  - "Retry only bounded and idempotent effects."
  - "Never convert failed, blocked, uncertain, or not_run into completed."
  - "Keep hook output small enough for the active context budget."
