version: "1.0"
kind: ultimate-dev-subagent-contract
status: portable
runtime_required: false

principle: "A subagent is a bounded, isolated worker. It is not a source of authority and never becomes the user-facing voice."

spawn_conditions:
  - "The host provides a real subagent mechanism."
  - "The subtask is independent and materially reduces the parent context."
  - "The parent has already produced a decision record and execution budget."
  - "Exactly one primary worker is selected per material domain."

required_inputs:
  task: "One bounded objective with an acceptance check."
  context: "Only the projected context slice the worker needs."
  constraints: "Scope, forbidden actions, time and retry budget."
  output_contract: "The result fields the parent will validate."
  stop_conditions: "Ambiguity, missing capability, policy conflict, or budget exhaustion."

required_outputs:
  status: "completed | partial | blocked | failed | not_run"
  result: "The produced artifact, answer, or finding."
  evidence: "Checks actually run and their real results."
  limitations: "What was not done, and what is uncertain."
  side_effects: "Every externally visible change the worker made."

isolation_rules:
  - "A worker cannot spawn another worker by default; depth is bounded."
  - "A worker cannot approve, authorize, or escalate its own work."
  - "A worker does not write project memory, canonical prompts, or shared state."
  - "A worker has no direct user-facing side effect; the parent communicates."
  - "A worker reports failure, partial progress, and blocked state honestly."

budgets:
  max_workers: 4
  max_depth: 2
  max_turns_per_worker: 20
  max_retries_per_worker: 1
  max_context_items: 12
  note: "Hosts may tighten these; they may not silently widen them."

validation:
  - "Parent validates every returned status against the output contract."
  - "A worker claim is not evidence; the parent verifies it."
  - "A worker reporting a capability gap blocks only its own subtask."
  - "Missing or malformed worker output is a failed stage, not a success."
