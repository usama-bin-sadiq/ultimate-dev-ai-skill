# Converted from JSON. YAML 1.2 is a JSON superset, so the data is
# byte-for-byte equivalent; only the serialisation changed.
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ultimate-dev:runtime:operation:1.0
title: Ultimate-Dev Runtime Operation
type: object
additionalProperties: false
required:
- operation_id
- task_id
- attempt
- idempotency_key
- action_fingerprint
- capability_id
- status
- created_at
properties:
  operation_id:
    type: string
    minLength: 1
  task_id:
    type: string
    minLength: 1
  attempt:
    type: integer
    minimum: 1
  idempotency_key:
    type: string
    minLength: 1
  action_fingerprint:
    type: string
    pattern: ^[a-f0-9]{64}$
  capability_id:
    type: string
    pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
  status:
    type: string
    enum:
    - pending
    - running
    - succeeded
    - failed
    - uncertain
    - cancelled
  created_at:
    type: string
  updated_at:
    type: string
  worker_id:
    type: string
    minLength: 1
  lease_expires_at_epoch:
    type:
    - number
    - 'null'
  recovered_at:
    type: string
  result:
    type: object
