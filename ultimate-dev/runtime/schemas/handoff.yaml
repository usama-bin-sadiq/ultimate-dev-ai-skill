# Converted from JSON. YAML 1.2 is a JSON superset, so the data is
# byte-for-byte equivalent; only the serialisation changed.
$schema: https://json-schema.org/draft/2020-12/schema
title: Ultimate-Dev Handoff
type: object
required:
- task_id
- objective
- status
- next_action
properties:
  task_id:
    type: string
  objective:
    type: string
  status:
    type: string
  next_action:
    type:
    - string
    - 'null'
  completed:
    type: array
  in_progress:
    type: array
  changed_files:
    type: array
  decisions:
    type: array
  failed_approaches:
    type: array
  verification:
    type: object
  blockers:
    type: array
  open_questions:
    type: array
