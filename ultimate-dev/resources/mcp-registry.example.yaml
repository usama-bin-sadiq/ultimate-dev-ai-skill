# EXAMPLE — MCP provider registry shape.
#
# This configuration belongs to the runtime and the environment, NOT to the
# skill package. The skill carries the capability vocabulary
# (resources/capability-vocabulary.yaml) and the failure policy
# (knowledge/policies/mcp-failures.md); the registry of which MCP servers
# exist and what they may do is runtime state. This file shows the shape an
# environment provides.
version: "1.0"

mcp:
  servers:

    - id: filesystem
      capabilities:
        - file_read
        - file_write
      # What this server may be used for here. Capability-based, not
      # tool-based: the adapter resolves server tools into capability ids.
      permissions:
        allow: [file_read]
        deny: [file_write]

    - id: git
      capabilities:
        - repository_read
        - repository_write
      permissions:
        allow: [repository_read]
        deny: [repository_write]

    - id: terminal
      capabilities:
        - command_execute
      permissions:
        allow: [command_execute]
        deny: []

    - id: browser
      capabilities:
        - browser_automation
      permissions:
        allow: [browser_automation]
        deny: []

# Per-agent capability permissions compose with the server permissions above;
# the stricter of the two wins. Example:
#
# agent: backend-developer
# capabilities:
#   allow: [file_read, file_write, code_search, execute_tests]
#   deny: [production_deploy, secrets_read]
#
# The runtime enforces the intersection. MCP servers never become available to
# every agent by existing.
