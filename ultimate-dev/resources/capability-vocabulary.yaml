# Provider-neutral capability vocabulary.
#
# Capabilities describe WHAT can be done, never how. Skills, agents, and
# workflows request entries from this file and nothing else; the runtime
# resolves each id to a provider (native, MCP, API, CLI, ...) using the
# provider records in knowledge/schemas/provider.md, and walks the fallback
# chain in fallback_order when one fails.
#
# `restricted: true` marks capabilities that are denied by default and must be
# explicitly allowed in an agent or environment permission set.
version: "1.0"

capabilities:

  file_read:
    describes: Read the contents of a file.
    side_effects: [read]
    providers:
      - { kind: native, entrypoint: host file capability, fallback_order: 1 }
      - { kind: mcp, server: filesystem, tool: read_file, fallback_order: 2 }
      - { kind: api, entrypoint: remote repository API, fallback_order: 3 }

  file_write:
    describes: Create or modify a file.
    side_effects: [write]
    providers:
      - { kind: native, entrypoint: host file capability, fallback_order: 1 }
      - { kind: mcp, server: filesystem, tool: write_file, fallback_order: 2 }

  code_search:
    describes: Search code by content, symbol, or pattern.
    side_effects: [read]
    providers:
      - { kind: native, entrypoint: host search capability, fallback_order: 1 }
      - { kind: cli, entrypoint: ripgrep or equivalent, fallback_order: 2 }

  repository_read:
    describes: Read repository state — history, diffs, branches.
    side_effects: [read]
    providers:
      - { kind: cli, entrypoint: git, fallback_order: 1 }
      - { kind: mcp, server: git, fallback_order: 2 }
      - { kind: api, entrypoint: remote repository API, fallback_order: 3 }

  repository_write:
    describes: Modify repository state — stage, branch, restore.
    side_effects: [write]
    providers:
      - { kind: cli, entrypoint: git, fallback_order: 1 }
      - { kind: mcp, server: git, fallback_order: 2 }

  execute_tests:
    describes: Run a project's test suite and report results.
    side_effects: [read]
    providers:
      - { kind: cli, entrypoint: project test command, fallback_order: 1 }
      - { kind: mcp, server: terminal, tool: run_command, fallback_order: 2 }

  command_execute:
    describes: Execute an arbitrary project command.
    side_effects: [write]
    providers:
      - { kind: cli, entrypoint: host shell capability, fallback_order: 1 }
      - { kind: mcp, server: terminal, tool: run_command, fallback_order: 2 }

  web_read:
    describes: Fetch or search web content for reading.
    side_effects: [network, read]
    providers:
      - { kind: native, entrypoint: host web capability, fallback_order: 1 }
      - { kind: mcp, server: fetch, fallback_order: 2 }

  browser_automation:
    describes: Drive a real browser — navigate, click, fill, screenshot.
    side_effects: [network, write]
    providers:
      - { kind: mcp, server: browser, fallback_order: 1 }
      - { kind: cli, entrypoint: playwright or equivalent, fallback_order: 2 }

  database_read:
    describes: Query a database for reading.
    side_effects: [read]
    providers:
      - { kind: database-connector, entrypoint: runtime-configured, fallback_order: 1 }
      - { kind: mcp, server: database, fallback_order: 2 }

  secrets_read:
    describes: Read secret material.
    side_effects: [credential]
    restricted: true
    providers: []   # wired only by explicit environment grant

  production_deploy:
    describes: Deploy to a production environment.
    side_effects: [write, irreversible]
    restricted: true
    providers: []   # wired only by explicit environment grant
