# Model capability profiles.
#
# The skill definition does not change across model tiers. The runtime reads
# the active model's profile and adapts EXECUTION — prompt size, branching,
# parallelism, planning mode — never the architecture. Strong models improve
# execution; they are never required for it.
#
# kernel_tier maps the five model tiers onto the kernel's three host tiers in
# references/model-adaptation.md: the rung and the procedure ceiling are
# governed there. This file governs the mechanism below them.
version: "1.0"

profile_schema:
  reasoning: low | medium | high | very_high
  context: small | medium | large | huge
  tool_calling: true | false | optional
  structured_output: true | false | optional
  parallelism: true | false | optional

tiers:

  tiny:
    reasoning: low
    context: small
    tool_calling: false
    structured_output: false
    parallelism: false
    kernel_tier: small
    execution:
      planning_mode: deterministic
      prompt: one task at a time, small prompts, explicit state, explicit schemas
      validation: frequent
      branching: limited

  small:
    reasoning: low
    context: small
    tool_calling: optional
    structured_output: optional
    parallelism: false
    kernel_tier: small
    execution:
      planning_mode: deterministic
      prompt: one task at a time; load SKILL-compact.md before SKILL.md
      validation: frequent
      branching: limited

  medium:
    reasoning: medium
    context: medium
    tool_calling: optional
    structured_output: optional
    parallelism: optional
    kernel_tier: mid
    execution:
      planning_mode: either
      prompt: standard kernel, few and larger work units
      validation: standard
      branching: standard

  large:
    reasoning: high
    context: large
    tool_calling: true
    structured_output: true
    parallelism: true
    kernel_tier: mid
    execution:
      planning_mode: either
      prompt: richer context, related artifacts together
      validation: standard
      branching: parallel opportunities permitted

  huge:
    reasoning: very_high
    context: huge
    tool_calling: true
    structured_output: true
    parallelism: true
    kernel_tier: frontier
    execution:
      planning_mode: either
      prompt: full kernel; complex planning; parallel workflows
      validation: standard
      branching: parallel opportunities permitted

rules:
  - No model tier requires changes to skill, agent, capability, or workflow records.
  - Richer context, complex planning, and parallelism are optimizations, never requirements.
  - A model with no tool calling executes through the runtime-driven mode: the model decides, the runtime calls.
  - Crossing to a lower tier than the host offers is a decision with a stated reason, the same as crossing upward.
